/* ============================================================
   COMMAND PALETTE
============================================================ */
const CMDS = [
  ...SPACES.map(s=>({grp:'Spaces',icon:s.icon,text:`Go to ${s.name}`,sub:s.sub,short:s.key,fn:()=>goSpace(s.id)})),
  {grp:'Actions',icon:'＋',text:'New convoy',short:'⌘N',fn:()=>{goSpace('convoy');setTimeout(newThread,40)}},
  {grp:'Actions',icon:'＋',text:'New issue',short:'C',fn:()=>{goSpace('tracks');toast('New issue','Press ⌘↵ to save')}},
  {grp:'Actions',icon:'＋',text:'New page',short:'⌘P',fn:()=>{goSpace('pages');toast('New page','Untitled created')}},
  {grp:'Actions',icon:'＋',text:'New task',short:'T',fn:()=>{goSpace('tasks');toast('New task','Added to Today')}},
  {grp:'Actions',icon:'◉',text:'Start huddle',short:'⌘H',fn:()=>{goSpace('huddle');toast('Huddle started','Inviting pinned agents')}},
  {grp:'Actions',icon:'☾',text:'Toggle theme',fn:()=>toast('Theme','RoadBound is the only theme. By design.')},
  ...AGENTS.map(a=>({grp:`Agents · ${a.group}`,icon:'●',text:`Open ${a.name}`,sub:a.role,fn:()=>openAgent(a.slug)})),
  ...NODES.map(n=>({grp:'Fleet',icon:n.kind.startsWith('Pi')?'⌬':'☁',text:`${n.label} · ${n.name}`,sub:`${n.role} — ${n.kind}`,fn:()=>openFleetNode(n.id)})),
  {grp:'Help',icon:'?',text:'Keyboard shortcuts',short:'?',fn:()=>showShortcuts()},
  {grp:'Help',icon:'⌬',text:'Brand voice — locked',fn:()=>toast('Voice','Remember the Road. Pave Tomorrow.')},
];

function openPalette(){
  document.getElementById('overlay').classList.add('open');
  document.getElementById('cmdInput').value='';
  state.cmdSelected=0;
  renderPalette();
  setTimeout(()=>document.getElementById('cmdInput').focus(),20);
}
function closePalette(){document.getElementById('overlay').classList.remove('open')}

function paletteFiltered(){
  const q = (document.getElementById('cmdInput')?.value||'').toLowerCase();
  if(!q) return CMDS;
  return CMDS.filter(c=>(c.text+' '+(c.sub||'')+' '+c.grp).toLowerCase().includes(q));
}

function renderPalette(){
  const list = paletteFiltered();
  if(state.cmdSelected>=list.length) state.cmdSelected = 0;
  const groups = {};
  list.forEach(c=>{groups[c.grp]=groups[c.grp]||[];groups[c.grp].push(c)});
  const out = [];
  let idx = 0;
  Object.entries(groups).forEach(([grp,items])=>{
    out.push(`<div class="cmd-group">${grp}</div>`);
    items.forEach(c=>{
      const sel = idx===state.cmdSelected?'sel':'';
      out.push(`<div class="cmd-item ${sel}" data-i="${idx}" onmouseenter="state.cmdSelected=${idx};renderPaletteSel()" onclick="paletteRun(${idx})">
        <div class="cmd-icon">${c.icon}</div>
        <div class="cmd-text">${c.text}${c.sub?` <span style="color:var(--muted);font-size:11px">· ${c.sub}</span>`:''}</div>
        ${c.short?`<span class="cmd-shortcut">${c.short}</span>`:''}
      </div>`);
      idx++;
    });
  });
  document.getElementById('cmdResults').innerHTML = out.join('') || `<div style="padding:30px;text-align:center;color:var(--sub);font-size:12px">No matches.</div>`;
}

function renderPaletteSel(){
  document.querySelectorAll('.cmd-item').forEach(el=>el.classList.toggle('sel',+el.dataset.i===state.cmdSelected));
}

function paletteRun(i){
  const list = paletteFiltered();
  if(list[i]) list[i].fn();
  closePalette();
}

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return;}
  if(e.key==='Escape'){closePalette();return;}
  const overlay = document.getElementById('overlay');
  if(overlay.classList.contains('open')){
    const list = paletteFiltered();
    if(e.key==='ArrowDown'){e.preventDefault();state.cmdSelected=Math.min(state.cmdSelected+1,list.length-1);renderPaletteSel();}
    if(e.key==='ArrowUp'){e.preventDefault();state.cmdSelected=Math.max(state.cmdSelected-1,0);renderPaletteSel();}
    if(e.key==='Enter'){e.preventDefault();paletteRun(state.cmdSelected);}
    return;
  }
  if((e.metaKey||e.ctrlKey)&&['1','2','3','4','5','6','7','8','9','0'].includes(e.key)){
    e.preventDefault();
    const idx = e.key==='0'?9:(+e.key-1);
    if(SPACES[idx]) goSpace(SPACES[idx].id);
  }
});

function showShortcuts(){
  toast('Shortcuts','⌘K palette · ⌘1–⌘0 Spaces · / slash · @ mention · ↵ send · ⇧↵ newline · e archive');
}

/* ============================================================
   TOASTS
============================================================ */
function toast(title,text){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML=`<div class="toast-bar"></div><div class="toast-body"><div class="toast-title">${title}</div><div class="toast-text">${text}</div></div><span class="toast-close" onclick="this.closest('.toast').remove()">×</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .25s';setTimeout(()=>el.remove(),300)},4200);
}

/* ============================================================
   LOCAL AI COCKPIT (Open WebUI launcher)
   - RoadTrip = solo BlackRoad agent room (27 native agents)
   - Open WebUI = local model cockpit on http://localhost:3000
   - Local-only: never auto-fetch localhost from a public host
============================================================ */
const COCKPIT_URL = 'http://localhost:3000';
function isLocalHost(){
  const h = location.hostname;
  return location.protocol === 'file:' || h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0';
}
function openCockpit(){
  const ov = document.getElementById('cockpitOverlay');
  const wrap = document.getElementById('cockpitFrameWrap');
  if(!ov || !wrap) return;
  if(!isLocalHost()){
    window.open(COCKPIT_URL, '_blank', 'noopener');
    return;
  }
  wrap.innerHTML =
    '<iframe class="cockpit-frame" src="'+COCKPIT_URL+'" referrerpolicy="no-referrer" '+
    'sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads"></iframe>'+
    '<div class="cockpit-fallback" id="cockpitFallback" style="display:none">'+
      '<h3>Open WebUI isn\'t reachable</h3>'+
      '<p>RoadTrip looked for Open WebUI on <b>'+COCKPIT_URL+'</b> but it didn\'t respond. '+
      'Start your local Docker/Ollama stack, or open it directly:</p>'+
      '<a class="btn" href="'+COCKPIT_URL+'" target="_blank" rel="noopener">Open WebUI in new tab ↗</a>'+
      '<div class="cockpit-models">'+
        '<b>Suggested local models</b><br>'+
        '• <b>qwen2.5-coder:7b</b> — coding<br>'+
        '• <b>qwen2.5:3b</b> — lighter chat<br>'+
        '• <b>roadlm:latest</b> — BlackRoad-flavored<br>'+
        '• <b>nomic-embed-text:latest</b> — embeddings (not chat)'+
      '</div>'+
    '</div>';
  fetch(COCKPIT_URL, {mode:'no-cors', cache:'no-store'})
    .catch(()=>{ const f=document.getElementById('cockpitFallback'); if(f) f.style.display='flex'; });
  ov.classList.add('is-open');
  document.addEventListener('keydown', cockpitEsc);
}
function closeCockpit(){
  const ov = document.getElementById('cockpitOverlay');
  const wrap = document.getElementById('cockpitFrameWrap');
  if(ov) ov.classList.remove('is-open');
  if(wrap) wrap.innerHTML = '';
  document.removeEventListener('keydown', cockpitEsc);
}
function cockpitEsc(e){ if(e.key === 'Escape') closeCockpit(); }
(function pingCockpit(){
  if(!isLocalHost()) return;
  fetch(COCKPIT_URL, {mode:'no-cors', cache:'no-store'})
    .then(()=>{ const b=document.getElementById('tbCockpit'); if(b) b.classList.add('is-up'); })
    .catch(()=>{});
})();
