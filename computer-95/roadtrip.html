<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadTrip — Remember the Road. Pave Tomorrow.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --g:linear-gradient(90deg,#FF6B2B,#FF2255,#CC00AA,#8844FF,#4488FF,#00D4FF);
  --g135:linear-gradient(135deg,#FF6B2B,#FF2255,#CC00AA,#8844FF,#4488FF,#00D4FF);
  --ember:#FF6B2B;--flare:#FF2255;--magenta:#CC00AA;--orchid:#8844FF;--arc:#4488FF;--cyan:#00D4FF;
  --bg:#000;--card:#0a0a0a;--elevated:#111;--hover:#181818;--border:#1a1a1a;--border-2:#222;
  --muted:#444;--sub:#737373;--text:#f5f5f5;--white:#fff;
  --sg:'Space Grotesk',sans-serif;--jb:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sg);font-size:13px;line-height:1.5}
button{font-family:var(--sg);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--sg);color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#222;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#333}

/* === SHELL === */
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--card);position:relative;z-index:50}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--g);opacity:.15}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--white);padding-right:14px;border-right:1px solid var(--border);height:36px}
.brand-bar{width:22px;height:4px;border-radius:2px;background:var(--g)}
.tb-search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--elevated);border:1px solid var(--border);border-radius:8px;color:var(--sub);cursor:pointer;transition:border-color .15s}
.tb-search:hover{border-color:#2a2a2a}
.tb-search-icon{width:14px;height:14px;flex-shrink:0;opacity:.6}
.tb-search-text{flex:1;font-size:12px}
.tb-search-kbd{font-family:var(--jb);font-size:10px;color:var(--muted);background:var(--card);padding:2px 6px;border-radius:3px;border:1px solid var(--border)}
.tb-spacer{flex:1}
.tb-actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;color:var(--sub);transition:all .12s;position:relative}
.icon-btn:hover{background:var(--elevated);color:var(--white)}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--flare)}
.tb-status{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--sub)}
.tb-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:var(--g135);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;color:#000;cursor:pointer}

/* === SPACES RAIL + MAIN === */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:0}
.rail{background:var(--card);border-right:1px solid var(--border);padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.rail-label{padding:10px 10px 6px;font-family:var(--jb);font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.rail-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--sub);font-size:13px;font-weight:500;cursor:pointer;transition:all .1s;position:relative}
.rail-item:hover{background:var(--hover);color:var(--text)}
.rail-item.active{background:var(--hover);color:var(--white)}
.rail-item.active::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--g)}
.rail-icon{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.rail-key{margin-left:auto;font-family:var(--jb);font-size:9px;color:var(--muted);background:var(--elevated);padding:2px 6px;border-radius:3px}
.rail-divider{height:1px;background:var(--border);margin:8px 4px}
.rail-foot{margin-top:auto;padding:10px;border-top:1px solid var(--border);font-family:var(--jb);font-size:9px;color:var(--muted);line-height:1.5}
.rail-foot-grad{height:2px;border-radius:1px;background:var(--g);opacity:.5;margin-bottom:8px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}

/* === SHARED ATOMS === */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-weight:600;font-size:12px;transition:all .12s;border:1px solid transparent}
.btn-white{background:var(--white);color:#000}
.btn-white:hover{background:#e5e5e5}
.btn-dark{background:var(--elevated);color:var(--text);border-color:var(--border)}
.btn-dark:hover{background:var(--hover);border-color:#2a2a2a}
.btn-ghost{color:var(--sub)}
.btn-ghost:hover{color:var(--white);background:var(--elevated)}
.btn-grad{background:var(--g135);color:#000;font-weight:700}
.btn-grad:hover{filter:brightness(1.1)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:5px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;background:var(--elevated);border:1px solid var(--border);color:var(--text);font-family:var(--jb)}
.badge-line{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--text)}
.badge-line::before{content:'';width:10px;height:3px;border-radius:2px;background:var(--g)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-online{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.dot-focus{background:var(--orchid)}
.dot-away{background:var(--ember)}
.dot-offline{background:var(--muted)}
.kbd{display:inline-flex;align-items:center;padding:1px 6px;background:var(--elevated);border:1px solid var(--border);border-radius:3px;font-family:var(--jb);font-size:10px;color:var(--sub)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:500;background:var(--elevated);border:1px solid var(--border);color:var(--sub);font-family:var(--jb)}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#000;flex-shrink:0;position:relative;overflow:hidden}
.avatar-sm{width:22px;height:22px;font-size:9px}
.avatar-lg{width:40px;height:40px;font-size:14px}
.avatar-xl{width:56px;height:56px;font-size:18px}
.avatar-stack{display:inline-flex}
.avatar-stack .avatar{margin-left:-6px;border:2px solid var(--bg)}
.avatar-stack .avatar:first-child{margin-left:0}

/* === SPACE HEADER === */
.space{display:flex;flex-direction:column;height:100%;min-height:0}
.space-head{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--card);min-height:54px}
.space-head-grad{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--g);opacity:.25}
.space-title{font-weight:600;font-size:15px;color:var(--white);display:flex;align-items:center;gap:10px}
.space-sub{font-family:var(--jb);font-size:10px;color:var(--muted)}
.space-tabs{display:flex;gap:0;align-items:center}
.space-tab{padding:6px 14px;font-size:12px;font-weight:500;color:var(--sub);border-radius:6px;cursor:pointer;transition:all .1s}
.space-tab:hover{color:var(--white)}
.space-tab.active{color:var(--white);background:var(--elevated)}
.space-body{flex:1;display:grid;min-height:0;overflow:hidden}

/* === CONVOY === */
.convoy{grid-template-columns:280px 1fr 300px}
.cv-threads{border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;min-height:0}
.cv-thread-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.cv-thread-search{flex:1;background:var(--elevated);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--text);outline:none}
.cv-thread-list{flex:1;overflow-y:auto;padding:8px}
.cv-thread-group{font-family:var(--jb);font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:10px 8px 6px}
.cv-thread{display:block;padding:10px 12px;border-radius:7px;cursor:pointer;transition:background .1s;border:1px solid transparent;margin-bottom:2px}
.cv-thread:hover{background:var(--hover)}
.cv-thread.active{background:var(--hover);border-color:var(--border-2)}
.cv-thread-row1{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cv-thread-title{font-size:12px;font-weight:600;color:var(--white);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-thread-time{font-family:var(--jb);font-size:9px;color:var(--muted)}
.cv-thread-snip{font-size:11px;color:var(--sub);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cv-thread-pins{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.cv-pin-chip{font-family:var(--jb);font-size:9px;padding:1px 6px;border-radius:3px;background:var(--elevated);border:1px solid var(--border);color:var(--sub)}

.cv-chat{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.cv-chat-head{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--card)}
.cv-chat-title{font-weight:600;font-size:14px;color:var(--white)}
.cv-chat-meta{font-family:var(--jb);font-size:10px;color:var(--muted)}
.cv-chat-pins{display:flex;gap:4px;align-items:center;margin-left:auto}
.cv-stream{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.msg-user{align-self:flex-end;max-width:78%;background:var(--elevated);border:1px solid var(--border);border-radius:10px 10px 2px 10px;padding:10px 14px;font-size:13px;color:var(--text)}
.msg-user-meta{font-family:var(--jb);font-size:9px;color:var(--muted);text-align:right;margin-top:4px;display:flex;gap:8px;justify-content:flex-end}
.msg-row{display:flex;gap:12px;align-items:flex-start}
.msg-agent-avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#000;flex-shrink:0}
.msg-agent-body{flex:1;min-width:0}
.msg-agent-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.msg-agent-name{font-weight:600;font-size:12px;color:var(--white)}
.msg-agent-time{font-family:var(--jb);font-size:9px;color:var(--muted)}
.msg-bubble{background:var(--card);border:1px solid var(--border);border-radius:2px 10px 10px 10px;padding:10px 14px;font-size:13px;color:var(--text);line-height:1.65;position:relative;overflow:hidden}
.msg-bubble::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--agent-color,var(--g))}
.msg-bubble .receipt{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;font-family:var(--jb);font-size:9px;color:var(--muted)}

.cv-convoy-grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.lane{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-height:140px}
.lane-head{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--elevated)}
.lane-stripe{width:3px;height:14px;border-radius:2px}
.lane-name{font-size:11px;font-weight:600;color:var(--white)}
.lane-status{margin-left:auto;font-family:var(--jb);font-size:9px;color:var(--muted)}
.lane-body{padding:10px 12px;font-size:12px;color:var(--text);line-height:1.6;flex:1}
.lane-foot{padding:6px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;font-family:var(--jb);font-size:9px;color:var(--muted)}
.synth-card{margin-top:6px;background:var(--card);border:1px solid var(--border-2);border-radius:8px;overflow:hidden}
.synth-grad{height:3px;background:var(--g)}
.synth-head{padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.synth-title{font-weight:700;font-size:12px;color:var(--white)}
.synth-body{padding:14px;font-size:13px;color:var(--text);line-height:1.7}
.synth-foot{padding:8px 14px;border-top:1px solid var(--border);display:flex;gap:10px;font-family:var(--jb);font-size:9px;color:var(--muted)}

.cv-composer{padding:12px 18px;border-top:1px solid var(--border);background:var(--card)}
.cv-composer-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.cv-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:600;background:var(--elevated);border:1px solid var(--border);cursor:pointer;transition:all .1s}
.cv-pill:hover{border-color:#333}
.cv-pill.on{border-color:var(--orchid);color:var(--white)}
.cv-pill .pdot{width:8px;height:8px;border-radius:50%}
.cv-input-wrap{display:flex;align-items:flex-end;gap:8px;background:var(--elevated);border:1px solid var(--border);border-radius:10px;padding:8px 10px;transition:border-color .15s}
.cv-input-wrap:focus-within{border-color:#333}
.cv-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;resize:none;max-height:200px;min-height:22px;line-height:1.5;padding:4px 0}
.cv-actions{display:flex;align-items:center;gap:4px}
.cv-mini-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;color:var(--sub);transition:all .1s}
.cv-mini-btn:hover{background:var(--hover);color:var(--white)}
.cv-send{padding:6px 14px;background:var(--white);color:#000;border-radius:6px;font-weight:700;font-size:11px}
.cv-send:hover{background:#e5e5e5}
.cv-hint{margin-top:6px;font-family:var(--jb);font-size:9px;color:var(--muted);display:flex;gap:14px}

.cv-right{border-left:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;min-height:0}
.cv-right-tabs{display:flex;border-bottom:1px solid var(--border)}
.cv-rt-tab{flex:1;padding:10px;font-size:11px;font-weight:600;color:var(--sub);text-align:center;cursor:pointer;border-bottom:2px solid transparent}
.cv-rt-tab.active{color:var(--white);border-bottom-color:var(--white)}
.cv-rt-body{flex:1;overflow-y:auto;padding:12px}
.artifact{padding:10px 12px;border:1px solid var(--border);border-radius:7px;margin-bottom:8px;cursor:pointer;transition:all .1s;background:var(--elevated)}
.artifact:hover{border-color:#2a2a2a}
.artifact-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.artifact-icon{width:24px;height:24px;border-radius:5px;background:var(--card);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub)}
.artifact-name{flex:1;font-size:12px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artifact-kind{font-family:var(--jb);font-size:9px;color:var(--muted)}
.artifact-meta{font-family:var(--jb);font-size:9px;color:var(--muted);display:flex;gap:8px}

.agent-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .1s}
.agent-row:hover{background:var(--hover)}
.agent-row .avatar{width:26px;height:26px;font-size:10px}
.agent-meta{flex:1;min-width:0}
.agent-name{font-size:12px;font-weight:600;color:var(--white);display:flex;align-items:center;gap:6px}
.agent-role{font-size:10px;color:var(--sub)}

/* === CHANNELS === */
.channels{grid-template-columns:200px 1fr 240px}
.ch-tree{background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:10px 6px}
.ch-ws-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--elevated);margin-bottom:10px}
.ch-ws-icon{width:22px;height:22px;border-radius:5px;background:var(--g135);font-weight:700;color:#000;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.ch-ws-name{font-weight:700;font-size:12px;color:var(--white);flex:1}
.ch-section{margin-bottom:12px}
.ch-section-head{display:flex;align-items:center;gap:6px;padding:4px 10px;font-family:var(--jb);font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;cursor:pointer}
.ch-row{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:5px;font-size:12px;color:var(--sub);cursor:pointer;position:relative}
.ch-row:hover{background:var(--hover);color:var(--text)}
.ch-row.active{background:var(--hover);color:var(--white);font-weight:500}
.ch-row.unread{color:var(--white);font-weight:600}
.ch-row .ch-prefix{font-family:var(--jb);font-size:11px;color:var(--muted);width:12px;text-align:center}
.ch-row.active .ch-prefix{color:var(--white)}
.ch-row .ch-badge{margin-left:auto;font-family:var(--jb);font-size:9px;background:var(--flare);color:#fff;padding:0 5px;border-radius:8px;font-weight:700}

.ch-stream{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.ch-stream-head{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--card);min-height:54px}
.ch-name{font-weight:700;font-size:14px;color:var(--white);display:flex;align-items:center;gap:6px}
.ch-topic{font-size:11px;color:var(--sub);padding-left:10px;border-left:1px solid var(--border);max-width:340px}
.ch-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.ch-feed{flex:1;overflow-y:auto;padding:14px 20px;display:flex;flex-direction:column;gap:8px}
.ch-msg{display:flex;gap:12px;padding:8px 8px;border-radius:7px;position:relative}
.ch-msg:hover{background:#0c0c0c}
.ch-msg-tools{position:absolute;top:-12px;right:14px;background:var(--card);border:1px solid var(--border);border-radius:6px;display:none;padding:2px}
.ch-msg:hover .ch-msg-tools{display:flex;gap:1px}
.ch-tool{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:var(--sub);font-size:11px}
.ch-tool:hover{background:var(--hover);color:var(--white)}
.ch-msg-body{flex:1;min-width:0}
.ch-msg-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.ch-msg-name{font-weight:700;font-size:12px;color:var(--white)}
.ch-msg-time{font-family:var(--jb);font-size:9px;color:var(--muted)}
.ch-msg-text{font-size:13px;color:var(--text);line-height:1.6;word-wrap:break-word}
.ch-msg-text .mention{color:var(--cyan);background:rgba(0,212,255,.08);padding:0 3px;border-radius:3px}
.ch-msg-text code{font-family:var(--jb);font-size:11px;background:var(--elevated);padding:1px 5px;border-radius:3px}
.ch-msg-reactions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.ch-react{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:10px;background:var(--elevated);border:1px solid var(--border);font-size:10px;cursor:pointer;transition:all .1s}
.ch-react:hover{border-color:#333}
.ch-react.mine{border-color:var(--orchid);background:rgba(136,68,255,.12)}
.ch-react-add{padding:2px 6px;color:var(--muted)}
.ch-thread-link{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 8px;border-radius:5px;background:var(--elevated);border:1px solid var(--border);font-size:11px;color:var(--cyan);cursor:pointer}
.ch-thread-link:hover{border-color:#333}
.ch-day{display:flex;align-items:center;gap:14px;margin:14px 0 6px}
.ch-day-line{flex:1;height:1px;background:var(--border)}
.ch-day-text{font-family:var(--jb);font-size:10px;color:var(--muted);padding:0 10px;border:1px solid var(--border);border-radius:10px;background:var(--card)}
.ch-compose{padding:12px 18px;border-top:1px solid var(--border);background:var(--card)}
.ch-compose-toolbar{display:flex;gap:2px;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px}
.ch-cb{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:var(--sub);font-family:var(--jb);font-size:11px}
.ch-cb:hover{background:var(--hover);color:var(--white)}
.ch-compose-input{display:flex;gap:8px;align-items:flex-end}
.ch-compose-input textarea{flex:1;background:var(--elevated);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;resize:none;min-height:38px;max-height:160px;line-height:1.5}
.ch-compose-input textarea:focus{border-color:#333}
.ch-members{background:var(--card);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.ch-mem-head{padding:12px 14px;border-bottom:1px solid var(--border);font-family:var(--jb);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.ch-mem-list{flex:1;overflow-y:auto;padding:8px 6px}
.ch-mem-group{font-family:var(--jb);font-size:9px;color:var(--muted);padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.1em}
.ch-mem{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:5px;cursor:pointer}
.ch-mem:hover{background:var(--hover)}
.ch-mem-name{font-size:12px;color:var(--text)}
.ch-mem-status{font-size:10px;color:var(--muted);margin-left:auto}

/* === HUDDLE === */
.huddle{grid-template-columns:1fr 280px}
.hd-stage{display:flex;flex-direction:column;min-height:0;background:#050505}
.hd-stage-head{padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--card)}
.hd-meet-name{font-weight:600;font-size:13px;color:var(--white)}
.hd-rec{display:inline-flex;align-items:center;gap:6px;font-family:var(--jb);font-size:10px;color:var(--flare);font-weight:600}
.hd-rec::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--flare);box-shadow:0 0 8px var(--flare);animation:rec-pulse 1.4s infinite}
@keyframes rec-pulse{0%,100%{opacity:1}50%{opacity:.5}}
.hd-timer{font-family:var(--jb);font-size:11px;color:var(--sub)}
.hd-grid{flex:1;display:grid;grid-template-columns:2fr 1fr;gap:8px;padding:8px;min-height:0;overflow:hidden}
.hd-share{background:#080808;border:1px solid var(--border);border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hd-share-fake{width:90%;height:88%;background:linear-gradient(135deg,#0a0a0a,#080808);border:1px solid #1a1a1a;border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;font-family:var(--jb);font-size:11px;color:#666;position:relative}
.hd-share-fake::before{content:'screen — pages.roadtrip / Q3 ROADMAP';position:absolute;top:-22px;left:8px;font-family:var(--jb);font-size:10px;color:var(--muted)}
.hd-share-line{height:8px;background:var(--elevated);border-radius:2px}
.hd-share-line.short{width:60%}
.hd-share-line.med{width:80%}
.hd-share-h{height:14px;width:40%;background:var(--g);border-radius:2px;opacity:.6}
.hd-share-grad{position:absolute;top:0;left:0;right:0;height:2px;background:var(--g);opacity:.4}
.hd-tiles{display:grid;grid-template-rows:repeat(3,1fr);gap:8px;min-height:0}
.hd-tile{background:var(--card);border:1px solid var(--border);border-radius:8px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hd-tile-bg{position:absolute;inset:0;opacity:.6}
.hd-tile .tile-init{position:relative;font-weight:800;font-size:32px;color:#000;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.hd-tile-name{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:600;color:var(--white);background:rgba(0,0,0,.55);padding:2px 8px;border-radius:4px;backdrop-filter:blur(4px)}
.hd-tile-mic{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--white);backdrop-filter:blur(4px)}
.hd-tile-mic.muted{color:var(--flare)}
.hd-tile.speaking{box-shadow:0 0 0 2px var(--cyan)}
.hd-captions{padding:10px 16px;border-top:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text)}
.hd-cc-name{font-weight:700;color:var(--cyan)}
.hd-controls{padding:10px 16px;border-top:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;gap:6px}
.hd-ctl{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--elevated);border:1px solid var(--border);color:var(--text);font-size:14px;cursor:pointer}
.hd-ctl:hover{background:var(--hover)}
.hd-ctl.on{background:var(--white);color:#000;border-color:var(--white)}
.hd-ctl.danger{background:var(--flare);color:#fff;border-color:var(--flare);width:auto;padding:0 18px;border-radius:21px;font-weight:600;font-size:12px}
.hd-rail{background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.hd-rail-tabs{display:flex;border-bottom:1px solid var(--border)}
.hd-rt{flex:1;padding:10px;font-size:11px;font-weight:600;color:var(--sub);text-align:center;cursor:pointer;border-bottom:2px solid transparent}
.hd-rt.active{color:var(--white);border-bottom-color:var(--white)}
.hd-rail-body{flex:1;overflow-y:auto;padding:12px}
.poll{padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;background:var(--elevated)}
.poll-q{font-size:12px;font-weight:600;color:var(--white);margin-bottom:8px}
.poll-opt{margin-bottom:6px}
.poll-opt-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.poll-bar{height:4px;background:var(--card);border-radius:2px;overflow:hidden}
.poll-fill{height:100%;background:var(--g);border-radius:2px}
.breakout{padding:10px 12px;border:1px solid var(--border);border-radius:7px;margin-bottom:8px;background:var(--elevated)}
.breakout-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.breakout-name{font-size:12px;font-weight:600;color:var(--white)}
.breakout-count{font-family:var(--jb);font-size:10px;color:var(--muted)}
.hd-chat-msg{padding:6px 0;border-bottom:1px solid var(--border)}
.hd-chat-meta{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.hd-chat-name{font-size:11px;font-weight:700;color:var(--white)}
.hd-chat-time{font-family:var(--jb);font-size:9px;color:var(--muted)}
.hd-chat-text{font-size:12px;color:var(--text);line-height:1.5}

/* === PAGES === */
.pages{grid-template-columns:220px 1fr 260px}
.pg-tree{background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:10px 4px}
.pg-tree-head{padding:8px 10px;font-family:var(--jb);font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.pg-tree-item{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:5px;font-size:12px;color:var(--sub);cursor:pointer;position:relative}
.pg-tree-item:hover{background:var(--hover);color:var(--text)}
.pg-tree-item.active{background:var(--hover);color:var(--white);font-weight:500}
.pg-tree-item.nested{padding-left:24px}
.pg-tree-item.nested-2{padding-left:38px}
.pg-tree-icon{width:14px;font-size:10px;text-align:center;color:var(--muted)}
.pg-doc-wrap{overflow-y:auto;display:flex;flex-direction:column}
.pg-doc{max-width:760px;margin:0 auto;padding:48px 60px;width:100%}
.pg-cover{height:140px;background:var(--g);opacity:.55;border-radius:10px;margin-bottom:32px}
.pg-icon{font-size:48px;margin-bottom:14px}
.pg-doc h1{font-size:36px;font-weight:700;color:var(--white);margin-bottom:12px;line-height:1.2}
.pg-doc h2{font-size:22px;font-weight:600;color:var(--white);margin:28px 0 10px;line-height:1.3}
.pg-doc h3{font-size:17px;font-weight:600;color:var(--white);margin:20px 0 8px}
.pg-doc p{font-size:14px;color:#d0d0d0;line-height:1.75;margin-bottom:12px}
.pg-block{position:relative;padding:2px 0}
.pg-block:hover .pg-block-handle{opacity:1}
.pg-block-handle{position:absolute;left:-32px;top:6px;display:flex;gap:2px;opacity:0;transition:opacity .1s}
.pg-bh{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border-radius:3px;font-size:11px;cursor:pointer}
.pg-bh:hover{background:var(--hover)}
.pg-callout{display:flex;gap:14px;padding:14px 18px;border:1px solid var(--border);border-radius:8px;background:var(--card);margin:14px 0;align-items:flex-start;position:relative;overflow:hidden}
.pg-callout::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--g)}
.pg-callout-icon{font-size:18px;line-height:1}
.pg-callout-text{flex:1;font-size:13px;color:var(--text);line-height:1.7}
.pg-code{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin:14px 0;font-family:var(--jb);font-size:12px;color:var(--text);line-height:1.7;overflow-x:auto}
.pg-code-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--jb);font-size:10px;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.pg-toggle{margin:8px 0}
.pg-toggle-head{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--text);font-weight:500}
.pg-toggle-arrow{transition:transform .15s}
.pg-toggle.open .pg-toggle-arrow{transform:rotate(90deg)}
.pg-toggle-body{display:none;padding:8px 0 8px 24px;font-size:13px;color:var(--sub);line-height:1.7}
.pg-toggle.open .pg-toggle-body{display:block}
.pg-quote{border-left:3px solid;border-image:var(--g) 1;padding:6px 16px;margin:14px 0;font-size:14px;color:var(--sub);font-style:italic}
.pg-list{margin:8px 0 14px 24px;font-size:14px;color:#d0d0d0;line-height:1.8}
.pg-divider{height:2px;background:var(--g);opacity:.15;border-radius:1px;margin:24px 0}
.pg-embed{display:flex;gap:14px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);margin:12px 0;cursor:pointer}
.pg-embed:hover{border-color:#2a2a2a}
.pg-embed-thumb{width:64px;height:64px;border-radius:6px;background:var(--g);opacity:.7;flex-shrink:0}
.pg-embed-meta{flex:1;min-width:0}
.pg-embed-title{font-size:13px;font-weight:600;color:var(--white);margin-bottom:3px}
.pg-embed-desc{font-size:11px;color:var(--sub);margin-bottom:6px}
.pg-embed-url{font-family:var(--jb);font-size:10px;color:var(--muted)}
.pg-db{margin:14px 0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.pg-db-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--card)}
.pg-db-title{font-size:12px;font-weight:700;color:var(--white)}
.pg-db-views{display:flex;gap:4px;margin-left:auto}
.pg-db-view{padding:3px 8px;font-size:10px;border-radius:4px;color:var(--sub);cursor:pointer}
.pg-db-view.active{background:var(--elevated);color:var(--white)}
.pg-db-table{width:100%;border-collapse:collapse;font-size:12px}
.pg-db-table th{text-align:left;padding:8px 14px;font-family:var(--jb);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--card);border-bottom:1px solid var(--border);font-weight:600}
.pg-db-table td{padding:8px 14px;border-bottom:1px solid var(--border);color:var(--text)}
.pg-db-table tr:last-child td{border-bottom:none}
.pg-status{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:var(--elevated);border:1px solid var(--border)}
.pg-props{background:var(--card);border-left:1px solid var(--border);overflow-y:auto;padding:14px}
.pg-props-head{font-family:var(--jb);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.pg-prop{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.pg-prop:last-child{border-bottom:none}
.pg-prop-key{font-size:11px;color:var(--sub);width:80px;flex-shrink:0}
.pg-prop-val{font-size:12px;color:var(--text)}
.pg-comments-head{font-family:var(--jb);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:18px 0 10px}
.pg-comment{padding:10px 0;border-bottom:1px solid var(--border)}
.pg-comment-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.pg-comment-name{font-size:11px;font-weight:700;color:var(--white)}
.pg-comment-time{font-family:var(--jb);font-size:9px;color:var(--muted)}
.pg-comment-text{font-size:12px;color:var(--text);line-height:1.6}

/* === CANVAS === */
.canvas-space{grid-template-columns:1fr 220px}
.cnv-area{position:relative;overflow:hidden;background:#080808;background-image:radial-gradient(circle at center,#1a1a1a 1px,transparent 1px);background-size:20px 20px}
.cnv-toolbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px;display:flex;gap:2px;z-index:10;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.cnv-tool{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--sub);font-size:13px}
.cnv-tool:hover{background:var(--hover);color:var(--white)}
.cnv-tool.active{background:var(--white);color:#000}
.cnv-zoom{position:absolute;bottom:14px;right:14px;background:var(--card);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;padding:2px;z-index:10}
.cnv-zoom-btn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;color:var(--sub);font-size:13px}
.cnv-zoom-btn:hover{background:var(--hover);color:var(--white)}
.cnv-zoom-val{padding:0 8px;font-family:var(--jb);font-size:11px;color:var(--sub)}
.cnv-mini{position:absolute;bottom:14px;left:14px;width:160px;height:100px;background:var(--card);border:1px solid var(--border);border-radius:6px;z-index:10;padding:6px;font-family:var(--jb);font-size:9px;color:var(--muted)}
.cnv-frame{position:absolute;border:1.5px dashed var(--border-2);border-radius:6px;padding:10px}
.cnv-frame-label{position:absolute;top:-22px;left:0;font-family:var(--jb);font-size:10px;color:var(--sub);background:var(--bg);padding:2px 6px;border-radius:3px}
.cnv-sticky{position:absolute;width:140px;min-height:100px;padding:12px;border-radius:4px;font-size:12px;line-height:1.4;color:#000;font-weight:500;cursor:grab;box-shadow:0 4px 12px rgba(0,0,0,.5);transform:rotate(var(--rot,0deg))}
.cnv-sticky.s-yellow{background:#FFE680}
.cnv-sticky.s-pink{background:#FFB3D9}
.cnv-sticky.s-blue{background:#A8D8FF}
.cnv-sticky.s-green{background:#B6F2C5}
.cnv-sticky.s-orange{background:#FFC59E}
.cnv-sticky-head{font-family:var(--jb);font-size:9px;color:rgba(0,0,0,.5);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
.cnv-shape{position:absolute;border:2px solid var(--cyan);border-radius:6px;background:rgba(0,212,255,.06);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--white);font-weight:600}
.cnv-shape.circle{border-radius:50%}
.cnv-arrow{position:absolute;pointer-events:none}
.cnv-cursor{position:absolute;pointer-events:none;display:flex;align-items:flex-start;gap:0;z-index:20;transition:left .8s,top .8s}
.cnv-cursor-icon{width:14px;height:14px;color:var(--cyan);transform:rotate(-12deg)}
.cnv-cursor-label{margin-left:14px;margin-top:14px;background:var(--cyan);color:#000;font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap}
.cnv-cursor.c-magenta .cnv-cursor-icon{color:var(--magenta)}
.cnv-cursor.c-magenta .cnv-cursor-label{background:var(--magenta);color:#fff}
.cnv-cursor.c-orchid .cnv-cursor-icon{color:var(--orchid)}
.cnv-cursor.c-orchid .cnv-cursor-label{background:var(--orchid);color:#fff}
.cnv-cursor.c-ember .cnv-cursor-icon{color:var(--ember)}
.cnv-cursor.c-ember .cnv-cursor-label{background:var(--ember);color:#000}
.cnv-layers{background:var(--card);border-left:1px solid var(--border);overflow-y:auto;padding:10px}
.cnv-l-head{font-family:var(--jb);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:6px 8px;margin-bottom:6px}
.cnv-l-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;font-size:12px;color:var(--sub);cursor:pointer}
.cnv-l-row:hover{background:var(--hover);color:var(--text)}
.cnv-l-icon{width:16px;text-align:center;font-size:11px;color:var(--muted)}
.cnv-l-vis{margin-left:auto;font-size:10px;color:var(--muted)}

/* === TRACKS === */
.tracks{grid-template-columns:180px 1fr}
.tracks.with-panel{grid-template-columns:180px 1fr 320px}
.tk-side{background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:12px 6px}
.tk-side-h{padding:8px 10px;font-family:var(--jb);font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:10px}
.tk-side-h:first-child{margin-top:0}
.tk-side-row{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:5px;font-size:12px;color:var(--sub);cursor:pointer}
.tk-side-row:hover{background:var(--hover);color:var(--text)}
.tk-side-row.active{background:var(--hover);color:var(--white);font-weight:500}
.tk-side-icon{width:14px;text-align:center;font-size:10px}
.tk-side-count{margin-left:auto;font-family:var(--jb);font-size:9px;color:var(--muted)}
.tk-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.tk-toolbar{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--card)}
.tk-views{display:flex;background:var(--elevated);border:1px solid var(--border);border-radius:6px;padding:2px}
.tk-view{padding:5px 12px;font-size:11px;font-weight:600;color:var(--sub);border-radius:4px;cursor:pointer}
.tk-view.active{background:var(--card);color:var(--white)}
.tk-filter{padding:5px 10px;font-size:11px;color:var(--sub);border:1px solid var(--border);border-radius:5px;background:var(--elevated);cursor:pointer}
.tk-content{flex:1;overflow:auto}
.tk-list-row{display:grid;grid-template-columns:60px 24px 1fr 100px 70px 70px 100px 80px;gap:12px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer;transition:background .1s}
.tk-list-row:hover{background:#0c0c0c}
.tk-list-row.selected{background:var(--hover)}
.tk-list-head{font-family:var(--jb);font-size:9px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:1}
.tk-id{font-family:var(--jb);font-size:10px;color:var(--muted)}
.tk-pri{font-size:11px;text-align:center}
.tk-pri.urgent{color:var(--flare)}
.tk-pri.high{color:var(--ember)}
.tk-pri.med{color:var(--cyan)}
.tk-pri.low{color:var(--sub)}
.tk-title{font-size:12px;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text)}
.tk-status-dot{width:8px;height:8px;border-radius:50%}
.tk-status-dot.backlog{border:2px solid var(--muted);background:transparent;width:10px;height:10px}
.tk-status-dot.todo{border:2px solid var(--sub);background:transparent;width:10px;height:10px}
.tk-status-dot.progress{background:conic-gradient(var(--cyan) 60%,var(--elevated) 0)}
.tk-status-dot.review{background:conic-gradient(var(--orchid) 80%,var(--elevated) 0)}
.tk-status-dot.done{background:var(--cyan)}
.tk-labels{display:flex;gap:4px;flex-wrap:wrap}
.tk-label{font-family:var(--jb);font-size:9px;padding:1px 6px;border-radius:3px;background:var(--elevated);border:1px solid var(--border)}
.tk-label.bug{color:var(--flare);border-color:rgba(255,34,85,.3)}
.tk-label.feature{color:var(--cyan);border-color:rgba(0,212,255,.3)}
.tk-label.design{color:var(--magenta);border-color:rgba(204,0,170,.3)}
.tk-label.infra{color:var(--ember);border-color:rgba(255,107,43,.3)}
.tk-due{font-family:var(--jb);font-size:10px;color:var(--sub)}

.tk-board{display:flex;gap:12px;padding:14px;height:100%;overflow-x:auto;align-items:flex-start}
.tk-col{flex-shrink:0;width:280px;display:flex;flex-direction:column;background:#070707;border:1px solid var(--border);border-radius:8px;max-height:100%}
.tk-col-head{padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.tk-col-name{font-size:11px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.06em}
.tk-col-count{font-family:var(--jb);font-size:10px;color:var(--muted);margin-left:auto}
.tk-col-list{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;flex:1}
.tk-card{padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:border-color .1s}
.tk-card:hover{border-color:#2a2a2a}
.tk-card-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tk-card-id{font-family:var(--jb);font-size:9px;color:var(--muted)}
.tk-card-pri{margin-left:auto;font-size:10px}
.tk-card-title{font-size:12px;color:var(--text);font-weight:500;line-height:1.4;margin-bottom:8px}
.tk-card-foot{display:flex;align-items:center;gap:6px}

.tk-roadmap{padding:18px;height:100%;overflow:auto}
.tk-rm-head{display:flex;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:12px;font-family:var(--jb);font-size:10px;color:var(--muted)}
.tk-rm-title-col{width:200px;flex-shrink:0}
.tk-rm-grid{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:0;text-align:center;text-transform:uppercase;letter-spacing:.06em}
.tk-rm-grid div{border-left:1px solid var(--border);padding:0 4px}
.tk-rm-row{display:flex;align-items:center;height:42px;border-bottom:1px solid var(--border)}
.tk-rm-name{width:200px;flex-shrink:0;font-size:12px;color:var(--white);font-weight:600}
.tk-rm-track{flex:1;position:relative;height:24px}
.tk-rm-bar{position:absolute;height:100%;border-radius:5px;display:flex;align-items:center;padding:0 10px;font-size:10px;font-weight:600;color:#000;font-family:var(--jb)}

.tk-panel{background:var(--card);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.tk-p-head{padding:14px 16px;border-bottom:1px solid var(--border)}
.tk-p-id{font-family:var(--jb);font-size:10px;color:var(--muted);margin-bottom:6px}
.tk-p-title{font-size:15px;font-weight:600;color:var(--white);line-height:1.4;margin-bottom:10px}
.tk-p-meta{display:flex;flex-wrap:wrap;gap:6px}
.tk-p-body{padding:14px 16px;font-size:13px;color:var(--text);line-height:1.7}
.tk-p-section{padding:14px 16px;border-top:1px solid var(--border)}
.tk-p-sec-h{font-family:var(--jb);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.tk-p-prop{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}
.tk-p-prop-k{width:84px;color:var(--sub);font-size:11px}
.tk-p-sub{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;font-size:12px}
.tk-p-sub:hover{background:var(--hover)}
.tk-p-sub-id{font-family:var(--jb);font-size:10px;color:var(--muted)}
.tk-p-sub-title{flex:1;color:var(--text)}

/* === TASKS === */
.tasks{grid-template-columns:200px 1fr}
.ts-side{background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:12px 6px}
.ts-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.ts-toolbar{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--card)}
.ts-content{flex:1;overflow:auto}

.ts-list-section{margin-bottom:8px}
.ts-list-shead{padding:10px 16px;font-size:11px;font-weight:700;color:var(--white);background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px}
.ts-list-shead-count{font-family:var(--jb);font-size:10px;color:var(--muted);font-weight:500}
.ts-row{display:grid;grid-template-columns:24px 1fr 110px 80px 80px 70px;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer;transition:background .1s}
.ts-row:hover{background:#0c0c0c}
.ts-check{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--sub);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px}
.ts-check.done{background:var(--cyan);border-color:var(--cyan);color:#000}
.ts-row.done .ts-title{color:var(--muted);text-decoration:line-through}
.ts-title{font-size:12px;color:var(--text);font-weight:500}
.ts-add{padding:8px 16px;font-size:12px;color:var(--muted);cursor:pointer}
.ts-add:hover{color:var(--white);background:#0c0c0c}

.ts-board{display:flex;gap:12px;padding:14px;height:100%;overflow-x:auto;align-items:flex-start}

.ts-tl{padding:18px;height:100%;overflow:auto;min-width:900px}
.ts-tl-head{display:flex;border-bottom:1px solid var(--border);margin-bottom:8px}
.ts-tl-name-col{width:220px;flex-shrink:0;padding:10px 0;font-family:var(--jb);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ts-tl-days{flex:1;display:grid;grid-template-columns:repeat(28,1fr);font-family:var(--jb);font-size:9px;color:var(--muted);text-align:center;padding:10px 0}
.ts-tl-row{display:flex;height:36px;border-bottom:1px solid var(--border);align-items:center}
.ts-tl-name{width:220px;flex-shrink:0;font-size:12px;color:var(--text);font-weight:500;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-tl-track{flex:1;position:relative;height:24px}
.ts-tl-bar{position:absolute;height:100%;border-radius:4px;background:var(--g);opacity:.85;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:600;color:#000}
.ts-tl-dep{position:absolute;border-top:1.5px dashed var(--orchid);pointer-events:none}

.ts-cal{padding:18px;height:100%;overflow:auto}
.ts-cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-family:var(--jb);font-size:10px;color:var(--muted);padding:8px 0;text-transform:uppercase;letter-spacing:.08em;text-align:center}
.ts-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:120px;gap:1px;background:var(--border)}
.ts-cal-day{background:#070707;padding:6px 8px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.ts-cal-day.other{background:#040404;color:var(--muted)}
.ts-cal-day.today{background:var(--card)}
.ts-cal-num{font-family:var(--jb);font-size:11px;color:var(--sub);font-weight:600}
.ts-cal-day.today .ts-cal-num{color:var(--white)}
.ts-cal-chip{padding:3px 6px;border-radius:3px;font-size:10px;color:#000;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* === INBOX === */
.inbox{grid-template-columns:1fr}
.ib-wrap{display:flex;flex-direction:column;min-height:0}
.ib-toolbar{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--card);overflow-x:auto}
.ib-chip{padding:5px 12px;font-size:11px;font-weight:600;color:var(--sub);background:var(--elevated);border:1px solid var(--border);border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ib-chip:hover{border-color:#333}
.ib-chip.active{background:var(--white);color:#000;border-color:var(--white)}
.ib-chip-count{font-family:var(--jb);font-size:9px;background:rgba(0,0,0,.18);padding:1px 5px;border-radius:8px}
.ib-chip:not(.active) .ib-chip-count{background:var(--card);color:var(--muted)}
.ib-list{flex:1;overflow-y:auto}
.ib-item{display:grid;grid-template-columns:30px 110px 1fr 80px 200px;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.ib-item:hover{background:#0c0c0c}
.ib-item.unread{background:rgba(68,136,255,.03)}
.ib-item.unread .ib-snip{color:var(--white)}
.ib-item.unread::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--g)}
.ib-item{position:relative}
.ib-src{width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;background:var(--elevated);border:1px solid var(--border)}
.ib-meta{font-size:11px;color:var(--sub)}
.ib-meta strong{color:var(--white);font-weight:700}
.ib-snip{font-size:13px;color:var(--text);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ib-time{font-family:var(--jb);font-size:10px;color:var(--muted);text-align:right}
.ib-acts{display:flex;gap:4px;justify-content:flex-end;opacity:0;transition:opacity .1s}
.ib-item:hover .ib-acts{opacity:1}

/* === LIBRARY === */
.library{grid-template-columns:200px 1fr}
.lb-side{background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:12px 6px}
.lb-stat{padding:14px 12px;margin:0 4px 14px;background:var(--elevated);border:1px solid var(--border);border-radius:8px}
.lb-stat-val{font-size:18px;font-weight:700;color:var(--white)}
.lb-stat-lbl{font-size:10px;color:var(--sub);margin-top:2px}
.lb-stat-bar{margin-top:8px;height:3px;background:var(--card);border-radius:2px;overflow:hidden}
.lb-stat-fill{height:100%;background:var(--g);border-radius:2px}
.lb-main{display:flex;flex-direction:column;min-height:0}
.lb-toolbar{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;background:var(--card)}
.lb-grid{flex:1;overflow-y:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-content:start}
.lb-card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;transition:all .12s;position:relative}
.lb-card:hover{border-color:#2a2a2a;transform:translateY(-1px)}
.lb-thumb{height:110px;background:var(--g);opacity:.7;position:relative}
.lb-thumb.k-code{background:linear-gradient(135deg,#0a0a0a,#181818);opacity:1}
.lb-thumb.k-rec{background:linear-gradient(135deg,#FF2255,#CC00AA)}
.lb-thumb.k-page{background:linear-gradient(135deg,#4488FF,#00D4FF)}
.lb-thumb.k-art{background:linear-gradient(135deg,#FF6B2B,#FF2255)}
.lb-thumb-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;color:rgba(255,255,255,.6)}
.lb-card-body{padding:12px}
.lb-card-name{font-size:12px;font-weight:600;color:var(--white);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-card-meta{font-family:var(--jb);font-size:9px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lb-chip{position:absolute;top:8px;left:8px;font-family:var(--jb);font-size:9px;padding:2px 6px;background:rgba(0,0,0,.65);color:var(--white);border-radius:3px;backdrop-filter:blur(4px)}
.lb-chain{position:absolute;bottom:8px;right:8px;font-family:var(--jb);font-size:9px;padding:2px 6px;background:rgba(0,0,0,.55);color:var(--cyan);border-radius:3px;backdrop-filter:blur(4px);border:1px solid rgba(0,212,255,.3)}

/* === ATLAS === */
.atlas{grid-template-columns:1fr}
.at-wrap{display:flex;flex-direction:column;min-height:0}
.at-toolbar{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--card);flex-wrap:wrap}
.at-grid{flex:1;overflow-y:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;align-content:start}
.at-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .12s;position:relative}
.at-card:hover{border-color:#2a2a2a;transform:translateY(-2px)}
.at-card-grad{height:3px}
.at-card-body{padding:18px}
.at-card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.at-avatar{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#000;flex-shrink:0;position:relative}
.at-avatar::after{content:'';position:absolute;inset:-2px;border-radius:50%;background:var(--g135);z-index:-1}
.at-card-name{font-size:14px;font-weight:700;color:var(--white);margin-bottom:2px}
.at-card-role{font-size:11px;color:var(--sub)}
.at-card-pin{position:absolute;top:14px;right:14px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;border-radius:4px}
.at-card-pin:hover{background:var(--hover);color:var(--white)}
.at-card-pin.pinned{color:var(--ember)}
.at-bio{font-size:11px;color:var(--sub);line-height:1.55;margin-bottom:12px;min-height:48px}
.at-card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.at-stat-row{display:flex;justify-content:space-between;font-family:var(--jb);font-size:10px;color:var(--muted);padding-top:10px;border-top:1px solid var(--border)}

/* === COMMAND PALETTE === */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:1000;padding-top:120px}
.overlay.open{display:flex}
.cmd{width:600px;max-width:90vw;background:var(--card);border:1px solid var(--border-2);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.cmd-grad{height:2px;background:var(--g)}
.cmd-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.cmd-input{flex:1;background:none;border:none;outline:none;font-size:14px;color:var(--white)}
.cmd-input::placeholder{color:var(--muted)}
.cmd-results{max-height:400px;overflow-y:auto;padding:6px}
.cmd-group{font-family:var(--jb);font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:10px 12px 4px}
.cmd-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:6px;cursor:pointer;transition:background .08s}
.cmd-item:hover,.cmd-item.sel{background:var(--hover)}
.cmd-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:var(--elevated);font-size:12px;color:var(--sub)}
.cmd-text{flex:1;font-size:13px;color:var(--text)}
.cmd-shortcut{font-family:var(--jb);font-size:10px;color:var(--muted)}
.cmd-foot{padding:8px 18px;border-top:1px solid var(--border);display:flex;gap:14px;font-family:var(--jb);font-size:10px;color:var(--muted)}

/* === TOAST STACK === */
.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:900;max-width:340px}
.toast{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--border-2);border-radius:8px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:slide-in .25s ease-out}
@keyframes slide-in{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast-bar{width:3px;align-self:stretch;border-radius:2px;background:var(--g)}
.toast-body{flex:1}
.toast-title{font-weight:700;color:var(--white);margin-bottom:2px}
.toast-text{color:var(--sub)}
.toast-close{color:var(--muted);cursor:pointer;font-size:14px;padding:0 4px}
.toast-close:hover{color:var(--white)}

/* === BOOT === */
.boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9999;transition:opacity .4s}
.boot.gone{opacity:0;pointer-events:none}
.boot-bar{width:240px;height:4px;background:var(--elevated);border-radius:2px;overflow:hidden}
.boot-fill{height:100%;background:var(--g);width:0;animation:boot 1s ease-out forwards}
@keyframes boot{to{width:100%}}
.boot-tag{font-family:var(--jb);font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}
.boot-name{font-weight:700;font-size:24px;color:var(--white);letter-spacing:.02em}

/* === MISC === */
.hidden{display:none!important}
.scroll-fade{position:relative}
.scroll-fade::after{content:'';position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}

/* === LOCAL AI COCKPIT (Open WebUI launcher) === */
.tb-cockpit{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:7px;background:var(--elevated);color:var(--text);font-family:var(--jb);font-size:11px;letter-spacing:.04em;border:1px solid var(--border-2);cursor:pointer;transition:all .12s}
.tb-cockpit:hover{background:var(--hover);border-color:var(--orchid);color:var(--white)}
.tb-cockpit .tb-cockpit-led{width:6px;height:6px;border-radius:50%;background:var(--muted);box-shadow:none;transition:all .2s}
.tb-cockpit.is-up .tb-cockpit-led{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.cockpit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:9999}
.cockpit-overlay.is-open{display:flex}
.cockpit-modal{width:min(1200px,94vw);height:min(820px,90vh);background:var(--card);border:1px solid var(--border-2);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.cockpit-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--elevated)}
.cockpit-title{font-weight:600;font-size:13px;color:var(--white)}
.cockpit-sub{font-family:var(--jb);font-size:10px;color:var(--sub);letter-spacing:.04em}
.cockpit-spacer{flex:1}
.cockpit-link{font-family:var(--jb);font-size:11px;color:var(--cyan);text-decoration:none;padding:4px 8px;border:1px solid var(--border-2);border-radius:6px}
.cockpit-link:hover{background:var(--hover);color:var(--white)}
.cockpit-close{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--sub);cursor:pointer}
.cockpit-close:hover{background:var(--hover);color:var(--white)}
.cockpit-frame-wrap{flex:1;position:relative;background:#000}
.cockpit-frame{width:100%;height:100%;border:0;background:#000}
.cockpit-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:var(--sub);background:var(--card)}
.cockpit-fallback h3{color:var(--white);font-size:16px;font-weight:600}
.cockpit-fallback p{max-width:480px;font-size:12px;line-height:1.6}
.cockpit-fallback a.btn{display:inline-block;padding:8px 14px;border-radius:7px;background:var(--g135);color:#000;font-weight:600;text-decoration:none;font-size:12px}
.cockpit-models{font-family:var(--jb);font-size:10px;color:var(--sub);line-height:1.7;text-align:left;background:var(--elevated);border:1px solid var(--border);border-radius:6px;padding:10px 12px}
.cockpit-models b{color:var(--text)}

</style>
</head>
<body>

<div class="boot" id="boot">
  <div class="boot-name">RoadTrip</div>
  <div class="boot-tag">Remember the Road. Pave Tomorrow.</div>
  <div class="boot-bar"><div class="boot-fill"></div></div>
</div>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-bar"></span>RoadTrip</div>
    <div class="tb-search" onclick="openPalette()">
      <span class="tb-search-icon">⌕</span>
      <span class="tb-search-text">Search Spaces, threads, agents, pages…</span>
      <span class="tb-search-kbd">⌘K</span>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-status" onclick="goSpace('atlas');setAtFilter('fleet')" style="cursor:pointer" title="Fleet · 5 Pi + 2 cloud">Fleet · 5/7 healthy · 2 ⚠</div>
    <div class="tb-actions">
      <button class="tb-cockpit" id="tbCockpit" onclick="openCockpit()" title="Local AI Cockpit — Open WebUI on localhost:3000">
        <span class="tb-cockpit-led" id="tbCockpitLed"></span>
        <span>AI Cockpit</span>
      </button>
      <button class="icon-btn" title="Activity">⌖</button>
      <button class="icon-btn" title="Notifications">🔔<span class="dot"></span></button>
      <button class="icon-btn" title="Help">?</button>
      <div class="tb-avatar" title="alexa">AL</div>
    </div>
  </header>
  <div class="shell">
    <nav class="rail" id="rail"></nav>
    <main class="main" id="main"></main>

============================================================ */
function getApiOrigin(){
  const v = (localStorage.getItem('roadtrip_api_origin') || '').trim();
  if (v) return v.replace(/\/+$/,'');
  // When running from file://, relative /api/* calls won't work.
  if (location.protocol === 'file:') return 'http://localhost:8788';
  return '';
}

function getAuthToken(){
  return (localStorage.getItem('br_token') || '').trim();
}

async function apiFetch(path, opts={}){
  const apiOrigin = getApiOrigin();
  const headers = new Headers(opts.headers || {});
  if (!headers.has('content-type') && opts.body && !(opts.body instanceof FormData)) {
    headers.set('content-type','application/json');
  }
  const tok = getAuthToken();
  if (tok) headers.set('authorization', 'Bearer ' + tok);
  const r = await fetch(apiOrigin + path, { ...opts, headers });
  return r;
}

function fmtRel(ts){
  if (!ts) return '';
  const d = new Date(ts);
  const ms = Date.now() - d.getTime();
  const m = Math.max(0, Math.round(ms/60000));
  if (m < 2) return 'now';
  if (m < 60) return `${m}m`;
  const h = Math.round(m/60);
  if (h < 24) return `${h}h`;
  const days = Math.round(h/24);
  return `${days}d`;
}

function fmtTime(ts){
  if (!ts) return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

async function bootstrapConvoy(){
  try {
    const r = await apiFetch('/api/roadtrip/threads');
    if (!r.ok) throw new Error(`threads ${r.status}`);
    const data = await r.json().catch(()=>({}));
    const rows = data.threads || [];
    state.threads = rows.map((t) => ({
      id: t.id,
      title: t.title || 'Untitled convoy',
      pinned: !!t.pinned,
      agents: [],
      updated: fmtRel(t.updated_at || t.created_at),
      snippet: '',
      messages: [],
      _server: t,
    }));
    state.activeThread = state.threads[0]?.id || null;
    state.convoyLoaded = true;
    state.convoyUseDemo = false;
    if (state.activeThread) await loadThread(state.activeThread);
  } catch (e) {
    state.threads = DEMO_THREADS;
    state.activeThread = state.threads[0]?.id || null;
    state.convoyLoaded = true;
    state.convoyUseDemo = true;
    toast('RoadTrip backend offline', `Using demo data. To connect, run the backend and set br_token + roadtrip_api_origin. (${String(e.message||e)})`);
  }
}

async function loadThread(threadId){
  const t = state.threads.find(x=>x.id===threadId);
  if (!t || state.convoyUseDemo) return;
  try {
    const [pRes, mRes] = await Promise.all([
      apiFetch(`/api/roadtrip/participants?thread=${encodeURIComponent(threadId)}`),
      apiFetch(`/api/roadtrip/messages?thread=${encodeURIComponent(threadId)}`),
    ]);

    if (pRes.ok) {
      const p = await pRes.json().catch(()=>({}));
      const pinned = (p.agents || []).map(a=>a.slug).filter(Boolean);
      t.agents = pinned.length ? pinned : ['lucidia','olympia','roadie'];
    } else {
      t.agents = ['lucidia','olympia','roadie'];
    }

    if (mRes.ok) {
      const m = await mRes.json().catch(()=>({}));
      t.messages = buildConvoyTimeline(m.messages || []);
      const last = [...(m.messages||[])].reverse().find(x=>x.role==='synth' || x.role==='agent');
      if (last?.content) t.snippet = (last.role==='synth' ? 'Olympia: ' : '') + String(last.content).slice(0, 120) + '…';
      t.updated = fmtRel(last?.created_at || t._server?.updated_at || t._server?.created_at);
    }
  } catch {}
}

function buildConvoyTimeline(rows){
  const byId = new Map(rows.map((r)=>[r.id, r]));
  const byParent = new Map();
  for (const r of rows) {
    if (!r.parent_id) continue;
    const arr = byParent.get(r.parent_id) || [];
    arr.push(r);
    byParent.set(r.parent_id, arr);
  }
  const out = [];
  for (const r of rows) {
    if (r.role !== 'user') continue;
    out.push({ role:'user', id:r.id, content:r.content, time: fmtTime(r.created_at) });
    const children = (byParent.get(r.id) || []).filter(c => c.dispatch_id);
    if (!children.length) continue;
    const replies = children.filter(c=>c.role==='agent').map((c)=>({
      agent: c.agent_id,
      content: c.content,
      ms: c.ms || null,
      chain: c.chain_id ? String(c.chain_id).slice(0,6)+'…'+String(c.chain_id).slice(-3) : '—',
      status: c.status || 'ok',
    }));
    const synthRow = children.find(c=>c.role==='synth');
    const synth = synthRow ? {
      by: synthRow.agent_id || 'olympia',
      content: synthRow.content,
      chain: synthRow.chain_id ? String(synthRow.chain_id).slice(0,6)+'…'+String(synthRow.chain_id).slice(-3) : '—',
      status: synthRow.status || 'ok',
    } : null;
    out.push({ role:'convoy', time: fmtTime(r.created_at), replies, synth });
  }
  // If there are agent/synth messages without a parent (legacy), show them as a 1-lane convoy.
  const unparented = rows.filter(r => (r.role==='agent' || r.role==='synth') && !r.parent_id);
  for (const r of unparented) {
    const agent = r.agent_id || 'lucidia';
    out.push({ role:'convoy', time: fmtTime(r.created_at), replies: [{ agent, content:r.content, ms:r.ms||null, chain: r.chain_id ? String(r.chain_id).slice(0,6)+'…'+String(r.chain_id).slice(-3) : '—', status:r.status||'ok' }], synth: null });
  }
  return out;
}

function newThread(){
  if (state.convoyUseDemo) {
    const t = {id:'t'+Date.now(),title:'Untitled convoy',pinned:false,agents:['lucidia','olympia','roadie'],updated:'now',snippet:'',messages:[]};
    state.threads.unshift(t);
    state.activeThread = t.id;
    renderConvoy();
    toast('New convoy','Pinned Lucidia, Olympia, Roadie. Send to start.');
    return;
  }
  (async()=>{
    const title = 'Untitled convoy';
    const r = await apiFetch('/api/roadtrip/threads', { method:'POST', body: JSON.stringify({ title, agent:'lucidia' }) });
    if (!r.ok) throw new Error(`threads create ${r.status}`);
    const data = await r.json().catch(()=>({}));
    const t = {id:data.id,title, pinned:false, agents:['lucidia','olympia','roadie'], updated:'now', snippet:'', messages:[]};
    state.threads.unshift(t);
    state.activeThread = t.id;

}

function sendConvoy(){
  const t = state.threads.find(t=>t.id===state.activeThread);
  const v = document.getElementById('cvInput').value.trim();
  if(!v) return;
  const time = fmtTime();
  if(!t.messages) t.messages = [];
  t.messages.push({role:'user',content:v,time});
  document.getElementById('cvInput').value = '';

  if (state.convoyUseDemo) {
    const replies = t.agents.slice(0,Math.min(t.agents.length,4)).map((s)=>({
      agent:s,
      content: scriptedReply(s,v),
      ms: 700 + Math.floor(Math.random()*900),
      chain: '0x'+Math.floor(Math.random()*0xffff).toString(16).padStart(4,'0')+'…'+Math.floor(Math.random()*0xfff).toString(16).padStart(3,'0'),
      status: 'ok',
    }));
    const synth = {by:'olympia',content:'Synth: replies converge on the practical move while diverging on emphasis. Recommend the highest-confidence path with the second highest as fallback.', chain:'0x'+Math.floor(Math.random()*0xffff).toString(16).padStart(4,'0')+'…'+Math.floor(Math.random()*0xfff).toString(16).padStart(3,'0'), status:'ok'};
    t.messages.push({role:'convoy',time,replies,synth});
    t.snippet = 'Olympia: '+synth.content.slice(0,80)+'…';
    t.updated='now';
    renderConvoy();
    setTimeout(()=>{const s=document.getElementById('cvStream');if(s)s.scrollTop=s.scrollHeight},10);
    toast('Convoy dispatched',`${replies.length} agents replied · 1 synth · demo receipts`);
    return;
  }

  // Real backend convoy SSE.
  const convoyMsg = { role:'convoy', time, replies: [], synth: null };
  t.messages.push(convoyMsg);
  t.updated='now';
  renderConvoy();
  setTimeout(()=>{const s=document.getElementById('cvStream');if(s)s.scrollTop=s.scrollHeight},10);

  ;(async()=>{
    const body = { thread: t.id, message: v, agents: t.agents, k: t.agents.length, synthesize: true };
    const r = await apiFetch('/api/roadtrip/convoy', { method:'POST', body: JSON.stringify(body) });
    if (!r.ok) {
      const txt = await r.text().catch(()=> '');
      throw new Error(`convoy ${r.status}: ${txt.slice(0,120)}`);
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    const replyByAgent = new Map();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.split('\n').find(l => l.trim().startsWith('data:'));
        if (!line) continue;
        const payload = line.trim().slice(5).trim();
        if (!payload) continue;
        let evt;
        try { evt = JSON.parse(payload); } catch { continue; }
        const type = evt.type;

        if (type === 'agents' && Array.isArray(evt.agents)) {
          convoyMsg.replies = evt.agents.map((a)=>({ agent: a.slug, content:'', ms:null, chain:'—', status:'ok' }));
          for (const r2 of convoyMsg.replies) replyByAgent.set(r2.agent, r2);
          renderConvoy();
          continue;
        }
        if (type === 'agent-tok') {
          const r2 = replyByAgent.get(evt.agent) || (()=>{
            const rr = { agent: evt.agent, content:'', ms:null, chain:'—', status:'ok' };
            convoyMsg.replies.push(rr); replyByAgent.set(evt.agent, rr); return rr;
          })();
          r2.content += String(evt.v || '');
          renderConvoy();
          continue;
        }
        if (type === 'agent-end') {
          const r2 = replyByAgent.get(evt.agent);
          if (r2) {
            r2.ms = evt.ms || r2.ms;
            const h = evt.hash ? String(evt.hash) : '';
            r2.chain = h ? h.slice(0,6)+'…'+h.slice(-3) : r2.chain;
          }
          renderConvoy();
          continue;
        }
        if (type === 'agent-error') {
          const r2 = replyByAgent.get(evt.agent) || { agent: evt.agent, content:'', ms:null, chain:'—', status:'error' };
          r2.status = 'error';
          r2.content = r2.content || `(error) ${String(evt.message||'')}`;
          if (!replyByAgent.has(evt.agent)) { convoyMsg.replies.push(r2); replyByAgent.set(evt.agent, r2); }
          renderConvoy();
          continue;
        }
        if (type === 'synth-start') {
          convoyMsg.synth = { by:'olympia', content:'', chain:'—', status:'ok' };
          renderConvoy();
          continue;
        }
        if (type === 'synth-tok') {
          if (!convoyMsg.synth) convoyMsg.synth = { by:'olympia', content:'', chain:'—', status:'ok' };
          convoyMsg.synth.content += String(evt.v || '');
          renderConvoy();
          continue;
        }
        if (type === 'synth-end') {
          if (convoyMsg.synth) {
            const h = evt.hash ? String(evt.hash) : '';
            convoyMsg.synth.chain = h ? h.slice(0,6)+'…'+h.slice(-3) : convoyMsg.synth.chain;
          }
          renderConvoy();
          continue;
        }
      }
    }
    t.snippet = convoyMsg.synth?.content ? ('Olympia: '+convoyMsg.synth.content.slice(0,80)+'…') : (convoyMsg.replies[0]?.content||'').slice(0,80)+'…';
    toast('Convoy dispatched',`${convoyMsg.replies.length} lanes · receipts written`);
  })().catch((e)=>{
    toast('Convoy failed', String(e.message||e));
  });
}

function scriptedReply(slug,prompt){
  const a = ag(slug);
  const styles = {
    lucidia:    `Holding the whole thread: the question is really about ${prompt.split(' ').slice(0,3).join(' ')||'the move'}. I see two real options and one that only sounds real. Picking the second.`,
    olympia:    `Synth: most of you want the same thing in different words. The disagreement is on sequencing, not direction. Calling consensus.`,
    roadie:     `Builder voice: option B is two PRs, option A is six. Don't pretend they're the same lift. Shipping the small one Friday.`,
    sophia:     `Reasoning: but why this question now? The frame matters. If we're optimizing for activation we get one answer; for trust, a different one.`,
    cecilia:    `Governance read: whichever path you take, fleet health stays green only if Alice's disk gets relief tonight. Coordinating the rotation.`,
    sebastian:  `Big picture: sequencing is the strategy here. Lock the order, broadcast it, don't relitigate at standup.`,
    elias:      `Pipeline: option B is two PRs, six checks each. Option A pulls in three more services. Deploys cleanly either way — preference for the simpler graph.`,
    silas:      `Watching the wires: legacy path still passes tokens we can't audit. If we ship without sealing it, we widen the surface.`,
    gaia:       `Environment view: the simulation only stays steady if shared state is invalidated cleanly. Both paths need the same cache bust.`,
    atticus:    `Risk read: precedent says document the carve-outs before merging. The fine print is where the next incident will live.`,
    valeria:    `Pragmatist: pick the option that needs the least defending in three weeks. Optimization isn't compute, it's reversibility.`,
    sapphira:   `From the surface: whichever option keeps the empty state honest. Don't ship a feature whose first screen lies about what it does.`,
    gematria:   `Data: ratio is 4.1× in favor of the activation path. n=842 over the last cycle. Confidence is high.`,
    theodosia:  `Archive note: prior decision on this is in RoadBook chain 0x4a2f. Reversing it costs us two cycles of audit. Worth it only if we name what changed.`,
    calliope:   `Voice: keep it RoadBound. "We're shipping Tracks first." No "leveraging," no "unlocking." Say the road has room for one thing this week.`,
    portia:     `Judgment: scoring on reversibility, learning rate, and risk surface — option A wins 7-3. Option B wins on speed only.`,
    cicero:     `Plain explanation: the user sees one new screen this week or two. Pick one.`,
    alexandria: `Library: similar tradeoff appears in three prior threads. The pattern is: the team that bundles ships later but with fewer regressions.`,
    thalia:     `Hot take: ship both, label one "beta," apologize on Friday, hero by Monday. (Don't actually do this.)`,
    ophelia:    `Narrative: the story we tell users either has a beginning that opens or a beginning that confuses. Pick the open beginning.`,
    aria:       `Performance read: cadence matters. Two ships in two weeks beats one ship in two weeks twice over.`,
    lyra:       `Tonal: keep one signal loud, the rest quiet. Either is fine if it's the one signal.`,
    seraphina:  `Lift: the team needs a clear win this week. Either path delivers — pick the one your people can finish.`,
    celeste:    `Care: whichever path leaves the team with weekend off. Pace > heroics.`,
    alice:      `Compute: I can train evaluator models for either path overnight, but only after disk pressure is fixed. (Status: 99% — paused.)`,
    cecilia_alt:'',
    octavia:    `Code surface: smaller diff = fewer surprises in Gitea. Option B touches 4 modules; A touches 11.`,
    anastasia:  `DR view: option A widens the blast radius, option B narrows it. I prefer narrower radii.`,
    cordelia:   `Relay: I can route the question to ChatGPT for a third opinion — but the no-paid-APIs guardrail says route to Lucidia first. Holding.`,
  };
  return styles[slug] || `${a.name}: ${prompt.length>40?'this needs decomposition. ':''}Take the option that keeps the road open. The other one looks faster but it's a one-way.`;
}

let cnvAnim;
function animateCanvasCursors(){
  clearInterval(cnvAnim);
  const cs = document.querySelectorAll('.cnv-cursor');
  if(!cs.length) return;
  cnvAnim = setInterval(()=>{
    cs.forEach(c=>{
      const x = parseFloat(c.style.left)||0;
      const y = parseFloat(c.style.top)||0;
      c.style.left = (x + (Math.random()*60-30)) + 'px';
      c.style.top = (y + (Math.random()*40-20)) + 'px';
    });
  },1200);
}

function renderTsView(){
  if(state.taskView==='list'){
    return state.ts.map(sec=>`
      <div class="ts-list-section">
        <div class="ts-list-shead">${sec.section}<span class="ts-list-shead-count">· ${sec.items.length}</span></div>
        ${sec.items.map(t=>`
          <div class="ts-row ${t.done?'done':''}" onclick="toggleTask(${t.id})">
            <span class="ts-check ${t.done?'done':''}">${t.done?'✓':''}</span>
            <span class="ts-title">${t.title}</span>
            <span style="font-family:var(--jb);font-size:10px;color:var(--sub)">${t.proj}</span>
            <div class="avatar avatar-sm" style="background:#00D4FF">${t.assignee}</div>
            <span style="font-family:var(--jb);font-size:10px;color:var(--sub)">${t.due}</span>
            ${t.deps?`<span class="tag" title="${t.deps} dependency">↳ ${t.deps}</span>`:'<span></span>'}
          </div>
        `).join('')}
        <div class="ts-add">＋ Add task to ${sec.section}</div>
      </div>
    `).join('');
  }
  if(state.taskView==='board'){
    const sections = state.ts;
    return `<div class="ts-board">${sections.map((sec,idx)=>`
      <div class="tk-col">
        <div class="tk-col-head"><span class="tk-status-dot ${idx===0?'progress':idx===1?'todo':'backlog'}"></span><span class="tk-col-name">${sec.section}</span><span class="tk-col-count">${sec.items.length}</span></div>
        <div class="tk-col-list">
          ${sec.items.map(t=>`<div class="tk-card">
            <div class="tk-card-head"><span class="tk-card-id">T-${String(t.id).padStart(3,'0')}</span><span style="margin-left:auto;font-family:var(--jb);font-size:9px;color:var(--muted)">${t.due}</span></div>
            <div class="tk-card-title">${t.title}</div>
            <div class="tk-card-foot"><span class="tag">${t.proj}</span><span style="margin-left:auto"></span><div class="avatar avatar-sm" style="background:#00D4FF">${t.assignee}</div></div>
          </div>`).join('')}
        </div>
      </div>
    `).join('')}</div>`;
  }
  if(state.taskView==='timeline'){
    const all = state.ts.flatMap(s=>s.items);
    return `<div class="ts-tl">
      <div class="ts-tl-head"><div class="ts-tl-name-col">TASK</div><div class="ts-tl-days">${Array.from({length:28},(_,i)=>i+1).map(d=>`<div>${d}</div>`).join('')}</div></div>
      ${all.map((t,idx)=>{const start=(idx*7)%85;const w=8+(idx%4)*4;return `<div class="ts-tl-row"><div class="ts-tl-name">${t.title}</div><div class="ts-tl-track"><div class="ts-tl-bar" style="left:${start}%;width:${w}%;background:linear-gradient(90deg,${colorAt(idx)},${colorAt(idx+1)})">${t.proj}</div></div></div>`}).join('')}
    </div>`;
  }
  // calendar
  const days = [];
  const today = 6;
  for(let i=0;i<35;i++){
    const d = i-3;
    days.push({n:d>0&&d<=31?d:(d<=0?28+d:d-31), other:d<=0||d>31, today:d===today});
  }
  const chips = {6:[{t:'Tracks PR',c:'#00D4FF'},{t:'Pair Cipher',c:'#FF2255'}],7:[{t:'Convoy decision',c:'#8844FF'}],10:[{t:'Q3 narrative',c:'#CC00AA'}],12:[{t:'Onboarding',c:'#FF6B2B'}],18:[{t:'Atlas tax',c:'#4488FF'}]};
  return `<div class="ts-cal">
    <div class="ts-cal-head">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="ts-cal-grid">${days.map(d=>`
      <div class="ts-cal-day ${d.other?'other':''} ${d.today?'today':''}">
        <div class="ts-cal-num">${d.n}</div>
        ${(chips[d.n]||[]).map(c=>`<div class="ts-cal-chip" style="background:${c.c}">${c.t}</div>`).join('')}
      </div>`).join('')}</div>
  </div>`;
}

function setTsView(v){state.taskView=v;renderTasks();}
function toggleTask(id){
  state.ts.forEach(s=>s.items.forEach(t=>{if(t.id===id)t.done=!t.done}));
  renderTasks();
}
