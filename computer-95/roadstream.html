<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>RoadStream — Any streaming. One pane, four panes, your call.</title>
<meta name="description" content="Unified streaming surface for BlackRoad. Watch, broadcast, stage, clip, and channel — pane-as-primitive across ten Spaces.">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --g:linear-gradient(90deg,#FF6B2B,#FF2255,#CC00AA,#8844FF,#4488FF,#00D4FF);
  --g135:linear-gradient(135deg,#FF6B2B,#FF2255,#CC00AA,#8844FF,#4488FF,#00D4FF);
  --g45:linear-gradient(45deg,#FF6B2B,#FF2255,#CC00AA,#8844FF,#4488FF,#00D4FF);
  --gv:linear-gradient(180deg,#FF6B2B,#FF2255,#CC00AA,#8844FF,#4488FF,#00D4FF);
  --ember:#FF6B2B;--flare:#FF2255;--magenta:#CC00AA;--orchid:#8844FF;--arc:#4488FF;--cyan:#00D4FF;
  --bg:#000;--card:#0a0a0a;--elevated:#111;--hover:#181818;--border:#1a1a1a;--muted:#444;--sub:#737373;--text:#f5f5f5;--white:#fff;
  --asphalt:#1a1a1a;--concrete:#737373;
  --sg:'Space Grotesk',sans-serif;--jb:'JetBrains Mono',monospace;
}
html,body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--sg);line-height:1.5;overflow:hidden}
body{display:grid;grid-template-rows:4px 56px 1fr 28px;height:100dvh}
a{color:var(--text);text-decoration:none}
button{font-family:var(--sg);cursor:pointer;color:inherit}
input,textarea,select{font-family:var(--sg);color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#1a1a1a;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#222}

/* ─── BRAND PRIMITIVES (verbatim from brand-guide-exact.html) ─── */
.grad-bar{height:4px;background:var(--g);background-size:200% 100%;animation:gp 12s ease-in-out infinite}
@keyframes gp{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:6px;font-weight:600;font-size:12px;border:none;transition:all .15s;background:var(--elevated);color:var(--text);border:1px solid var(--border)}
.btn:hover{border-color:#333}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:5px}
.btn-white{background:var(--white);color:#000;border-color:var(--white)}
.btn-white:hover{background:#e0e0e0}
.btn-outline{background:transparent}
.btn-ghost{background:transparent;border:none;color:var(--sub)}
.btn-ghost:hover{color:var(--white)}
.btn-icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:var(--elevated);border:1px solid var(--border);color:var(--sub);font-size:13px}
.btn-icon:hover{color:var(--white);border-color:#333}
.btn-grad{background:var(--g135);color:#fff;border:none;font-weight:600}
.btn-grad:hover{filter:brightness(1.1)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card-grad{height:3px;background:var(--g)}
.card-body{padding:16px}
.card-title{font-weight:600;font-size:14px;color:var(--white);margin-bottom:6px}
.card-text{font-size:12px;color:var(--sub);line-height:1.6}
.card-meta{font-family:var(--jb);font-size:10px;color:var(--muted);margin-top:8px;letter-spacing:.04em}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-header-title{font-weight:600;font-size:13px;color:var(--white)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;background:var(--elevated);border:1px solid var(--border);color:var(--text);font-family:var(--jb);letter-spacing:.04em;text-transform:uppercase}
.badge-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.badge-grad{border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--g135) border-box}
.badge-line{display:inline-flex;align-items:center;gap:6px;font-family:var(--jb);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
.badge-line::before{content:'';width:12px;height:3px;border-radius:2px;background:var(--g)}
.input{width:100%;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;transition:border-color .15s}
.input:focus{border-color:#333}
.textarea{width:100%;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;resize:vertical;min-height:60px;transition:border-color .15s}
.select{width:100%;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
.toggle{position:relative;width:36px;height:20px;display:inline-block;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--elevated);border:1px solid var(--border);border-radius:10px;transition:.2s;cursor:pointer}
.toggle-slider::before{content:'';position:absolute;width:14px;height:14px;left:2px;top:2px;background:var(--sub);border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider{background:var(--elevated);border-color:#333}
.toggle input:checked+.toggle-slider::before{transform:translateX(16px);background:var(--white)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--elevated);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--sub);flex-shrink:0;font-family:var(--sg)}
.avatar-sm{width:24px;height:24px;font-size:10px}
.avatar-lg{width:44px;height:44px;font-size:15px}
.avatar-xl{width:60px;height:60px;font-size:19px}
.avatar-ring{padding:2px;background:var(--g135);border-radius:50%}
.avatar-ring>.avatar{border:2px solid var(--bg)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:4px;font-size:10px;font-weight:500;background:var(--elevated);border:1px solid var(--border);color:var(--sub);font-family:var(--jb);letter-spacing:.04em;text-transform:uppercase}
.tag.on{color:var(--white);background:var(--hover);border-color:#333}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab{padding:9px 16px;font-size:12px;font-weight:500;color:var(--sub);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.tab:hover{color:var(--white)}
.tab.active{color:var(--white);border-bottom-color:var(--white)}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text);transition:background .1s}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--hover)}
.list-item-indicator{width:18px;height:3px;border-radius:2px;background:var(--g);flex-shrink:0}
.list-item-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item-meta{font-family:var(--jb);font-size:10px;color:var(--muted);letter-spacing:.04em}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;padding-bottom:18px;font-size:12px}
.timeline-item:last-child{padding-bottom:0}
.timeline-dot{position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--border);background:var(--bg)}
.timeline-dot.active{border:none;background:var(--g135)}
.timeline-title{font-weight:600;font-size:12px;color:var(--white);margin-bottom:2px}
.timeline-text{font-size:11px;color:var(--sub)}
.timeline-time{font-family:var(--jb);font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
.progress-track{width:100%;height:3px;background:var(--elevated);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;background:var(--g);transition:width .3s}
.alert{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;font-size:12px;border:1px solid var(--border);background:var(--card)}
.alert-bar{width:3px;border-radius:2px;background:var(--g);flex-shrink:0;align-self:stretch}
.alert-title{font-weight:600;color:var(--white);margin-bottom:2px}
.alert-text{color:var(--sub)}

/* ─── SHELL ─── */
.topbar{background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:14px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--white)}
.brand-bar{width:22px;height:4px;border-radius:2px;background:var(--g)}
.brand-name{letter-spacing:-.01em}
.brand-meta{font-family:var(--jb);font-size:10px;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;margin-left:4px}
.spacer-flex{flex:1}
.cmdk-trigger{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--sub);font-size:12px;cursor:pointer;min-width:200px;font-family:var(--sg)}
.cmdk-trigger:hover{border-color:#333;color:var(--white)}
.cmdk-trigger .kbd{margin-left:auto;font-family:var(--jb);font-size:10px;color:var(--muted);background:var(--elevated);border:1px solid var(--border);padding:2px 5px;border-radius:3px}
.plan-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:5px;font-family:var(--jb);font-size:10px;color:var(--text);background:var(--elevated);border:1px solid var(--border);letter-spacing:.06em;text-transform:uppercase}
.plan-pill .badge-dot{background:var(--g135)}

.shell{display:grid;grid-template-columns:64px 1fr;height:100%;min-height:0;overflow:hidden}
.shell.with-rail{grid-template-columns:64px 1fr 320px}
.shell.collapsed{grid-template-columns:0px 1fr}
.shell.collapsed.with-rail{grid-template-columns:0px 1fr 320px}
.sidebar{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:stretch;padding:8px 0;gap:2px;overflow:hidden}
.shell.collapsed .sidebar{display:none}
.side-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px;background:transparent;border:none;border-left:2px solid transparent;color:var(--sub);font-family:var(--jb);font-size:9px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;transition:all .15s;position:relative}
.side-btn:hover{background:var(--hover);color:var(--white)}
.side-btn.active{color:var(--white);border-left-color:var(--white);background:var(--hover)}
.side-btn .ico{font-size:18px;font-family:var(--sg);font-weight:600;line-height:1;background:var(--g135);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.02em}
.side-btn.active .ico{filter:saturate(1.2)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-top:1px solid var(--border)}

.workspace{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
.work-head{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);min-height:54px}
.work-head h2{font-weight:600;font-size:18px;color:var(--white);letter-spacing:-.01em}
.work-head .h-meta{font-family:var(--jb);font-size:10px;color:var(--sub);letter-spacing:.06em;text-transform:uppercase}
.work-body{flex:1;min-height:0;overflow:auto;padding:18px 22px}
.work-body.flush{padding:0}

.rail{background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.shell:not(.with-rail) .rail{display:none}
.rail-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.rail-title{font-weight:600;font-size:13px;color:var(--white)}
.rail-body{flex:1;min-height:0;overflow:auto;padding:14px 16px}

.statusbar{background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:14px;font-family:var(--jb);font-size:10px;color:var(--sub);letter-spacing:.06em;text-transform:uppercase}
.statusbar .pulse{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.statusbar a{color:var(--text)}.statusbar a:hover{color:var(--white)}

/* ─── SPACE: WATCH ─── */
.watch-wrap{display:grid;grid-template-columns:1fr 280px;gap:14px;height:100%}
.watch-stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.layout-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px}
.layout-shapes{display:inline-flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--bg)}
.layout-shape{padding:7px 10px;background:transparent;border:none;color:var(--sub);font-size:11px;font-family:var(--jb);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border-right:1px solid var(--border)}
.layout-shape:last-child{border-right:none}
.layout-shape:hover{color:var(--white);background:var(--hover)}
.layout-shape.on{color:#000;background:var(--white)}
.layout-shape svg{display:block;width:18px;height:14px}
.panes{display:grid;gap:8px;flex:1;min-height:0;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px}
.panes.shape-one{grid-template-columns:1fr;grid-template-rows:1fr}
.panes.shape-two-h{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.panes.shape-two-v{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
.panes.shape-four{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.pane{background:var(--card);border:1px solid var(--border);border-radius:8px;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:160px;transition:border-color .15s}
.pane.audible{border-color:#333}
.pane.audible::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--g);opacity:.85}
.pane.solo{box-shadow:inset 0 0 0 1px var(--cyan)}
.pane-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3)}
.pane-head .src-tag{font-family:var(--jb);font-size:9px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
.pane-head .pane-title{font-size:12px;font-weight:600;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pane-live{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:3px;background:var(--flare);color:#fff;font-family:var(--jb);font-size:9px;letter-spacing:.06em}
.pane-live .badge-dot{background:#fff;animation:pulse 1.6s infinite}
.pane-canvas{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#111 0%,#000 70%);position:relative;overflow:hidden}
.pane-canvas .scenebar{position:absolute;inset:auto 0 0 0;height:3px;background:var(--g);opacity:.4}
.pane-art{font-family:var(--jb);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:16px;line-height:1.7}
.pane-art .big{display:block;font-family:var(--sg);font-size:22px;font-weight:600;color:var(--white);letter-spacing:-.01em;margin-bottom:6px;text-transform:none}
.pane-foot{display:flex;align-items:center;gap:6px;padding:6px 8px;border-top:1px solid var(--border);background:rgba(0,0,0,.3);font-family:var(--jb);font-size:10px;color:var(--sub)}
.audio-ring{display:inline-flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:5px;overflow:hidden;background:var(--bg)}
.audio-ring button{padding:4px 7px;background:transparent;border:none;color:var(--sub);font-family:var(--jb);font-size:9px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;border-right:1px solid var(--border)}
.audio-ring button:last-child{border-right:none}
.audio-ring button:hover{color:var(--white);background:var(--hover)}
.audio-ring button.on[data-state="muted"]{color:var(--orchid);background:var(--hover)}
.audio-ring button.on[data-state="normal"]{color:var(--cyan);background:var(--hover)}
.audio-ring button.on[data-state="solo"]{color:#000;background:var(--cyan)}
.vol{flex:1;height:14px;display:flex;align-items:center}
.vol input{width:100%;-webkit-appearance:none;appearance:none;height:3px;background:var(--elevated);border-radius:2px;outline:none}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--white);cursor:pointer}

.watch-side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.side-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.side-card-head{padding:10px 14px;border-bottom:1px solid var(--border);font-family:var(--jb);font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.08em}
.side-card-body{padding:10px 14px}
.kvrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px}
.kvrow .k{color:var(--sub);font-family:var(--jb);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.kvrow .v{color:var(--text)}

/* ─── SPACE: DISCOVER ─── */
.dis-wrap{display:flex;flex-direction:column;gap:18px}
.hero{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);min-height:240px;display:flex;align-items:flex-end;padding:22px;background:var(--card)}
.hero::before{content:'';position:absolute;inset:0;background:var(--g135);opacity:.18}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 75% 30%,rgba(0,0,0,0) 0%,#000 80%)}
.hero-inner{position:relative;z-index:1;max-width:520px}
.hero h3{font-size:28px;font-weight:600;color:var(--white);margin:8px 0 6px;letter-spacing:-.01em}
.hero p{font-size:13px;color:var(--text);margin-bottom:14px;line-height:1.55}
.hero-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rail-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rail-row h4{font-size:13px;font-weight:600;color:var(--white);letter-spacing:-.005em}
.rail-row .more{font-family:var(--jb);font-size:10px;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;background:none;border:none;cursor:pointer}
.rail-row .more:hover{color:var(--white)}
.h-rail{display:grid;grid-auto-flow:column;grid-auto-columns:240px;gap:10px;overflow-x:auto;padding-bottom:6px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s}
.tile:hover{border-color:#333}
.tile-art{aspect-ratio:16/9;background:var(--g135);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:8px}
.tile-art::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.2),rgba(0,0,0,.7))}
.tile-art .live-dot{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:3px;background:var(--flare);color:#fff;font-family:var(--jb);font-size:9px;letter-spacing:.06em;z-index:1}
.tile-art .live-dot .d{width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
.tile-art .vcount{position:absolute;top:8px;right:8px;padding:3px 7px;background:rgba(0,0,0,.6);border-radius:3px;font-family:var(--jb);font-size:9px;color:var(--white);letter-spacing:.04em;z-index:1}
.tile-art .src-name{position:relative;z-index:1;font-family:var(--sg);font-size:14px;font-weight:600;color:#fff;letter-spacing:-.01em;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tile-body{padding:10px}
.tile-title{font-size:13px;font-weight:600;color:var(--white);margin-bottom:3px}
.tile-meta{font-family:var(--jb);font-size:10px;color:var(--muted);letter-spacing:.04em}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

/* ─── SPACE: GUIDE ─── */
.guide-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.guide{display:grid;grid-template-columns:160px 1fr;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card);min-height:540px}
.gu-channels{display:flex;flex-direction:column;border-right:1px solid var(--border)}
.gu-channels .gu-h{height:30px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-family:var(--jb);font-size:9px;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;background:var(--elevated)}
.gu-ch{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);height:60px}
.gu-ch:last-child{border-bottom:none}
.gu-ch-no{font-family:var(--jb);font-size:10px;color:var(--muted);width:24px}
.gu-ch-name{font-size:12px;font-weight:600;color:var(--white)}
.gu-ch-blurb{font-size:10px;color:var(--sub);font-family:var(--jb);letter-spacing:.04em;text-transform:uppercase}
.gu-grid{position:relative;overflow-x:auto}
.gu-times{display:grid;grid-template-columns:repeat(12,140px);height:30px;border-bottom:1px solid var(--border);background:var(--elevated);position:sticky;top:0;z-index:1}
.gu-time{padding:0 10px;display:flex;align-items:center;font-family:var(--jb);font-size:9px;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;border-right:1px solid var(--border)}
.gu-rows{position:relative}
.gu-row{display:flex;height:60px;border-bottom:1px solid var(--border);position:relative}
.gu-row:last-child{border-bottom:none}
.gu-block{padding:8px 10px;background:var(--card);border-right:1px solid var(--border);border-left:3px solid transparent;display:flex;flex-direction:column;justify-content:center;cursor:pointer;flex-shrink:0;overflow:hidden;transition:background .1s}
.gu-block:hover{background:var(--hover)}
.gu-block.live{border-left-color:var(--cyan)}
.gu-block .gb-title{font-size:12px;font-weight:600;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gu-block .gb-meta{font-family:var(--jb);font-size:9px;color:var(--sub);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.gu-now{position:absolute;top:0;bottom:0;width:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);z-index:2;pointer-events:none}

/* ─── SPACE: STUDIO ─── */
.studio-wrap{display:grid;grid-template-columns:240px 1fr 280px;gap:12px;height:100%}
.scenes-col,.sources-col{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;min-height:0}
.scenes-col .h,.sources-col .h{padding:10px 14px;border-bottom:1px solid var(--border);font-family:var(--jb);font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;justify-content:space-between}
.scenes-col .b,.sources-col .b{flex:1;overflow:auto;padding:8px}
.scene-item,.source-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);transition:background .1s}
.scene-item:hover,.source-item:hover{background:var(--hover)}
.scene-item.active{background:var(--hover);box-shadow:inset 2px 0 0 var(--white)}
.scene-item .scene-thumb{width:36px;height:24px;border-radius:3px;background:var(--g135);flex-shrink:0;border:1px solid var(--border)}
.studio-stage{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;min-height:0}
.studio-canvas{flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#111 0%,#000 70%);position:relative;overflow:hidden}
.studio-canvas .grad-frame{position:absolute;inset:8px;border-radius:6px;border:1px solid var(--border);background:radial-gradient(circle at 30% 30%,#1a1a1a,#000)}
.studio-canvas .preview{position:relative;z-index:1;text-align:center;padding:20px}
.studio-canvas .preview .ttl{font-size:24px;font-weight:600;color:var(--white);letter-spacing:-.01em;margin-bottom:6px}
.studio-canvas .preview .sub{font-family:var(--jb);font-size:10px;color:var(--sub);letter-spacing:.08em;text-transform:uppercase}
.studio-overlay-rec{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:4px;background:rgba(255,34,85,.16);border:1px solid var(--flare);font-family:var(--jb);font-size:10px;color:var(--flare);letter-spacing:.06em;z-index:2}
.studio-overlay-rec .rd{width:8px;height:8px;border-radius:50%;background:var(--flare);animation:pulse 1.2s infinite}
.studio-overlay-rec.off{background:var(--elevated);border-color:var(--border);color:var(--sub)}
.studio-overlay-rec.off .rd{background:var(--sub);animation:none}
.studio-bottom{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg)}
.transitions{display:inline-flex;gap:6px}
.tr{padding:6px 10px;border-radius:5px;background:var(--elevated);border:1px solid var(--border);font-family:var(--jb);font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.tr:hover{color:var(--white);border-color:#333}
.tr.on{background:var(--white);color:#000;border-color:var(--white)}
.meter{flex:1;height:6px;background:var(--elevated);border-radius:3px;overflow:hidden;position:relative}
.meter-fill{position:absolute;inset:0 70% 0 0;background:var(--g);border-radius:3px}

/* ─── SPACE: GREENROOM ─── */
.green-wrap{display:grid;grid-template-columns:1fr 300px;gap:12px;height:100%}
.green-stage{display:flex;flex-direction:column;gap:10px;min-height:0}
.green-grid{flex:1;display:grid;gap:8px;min-height:0;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px}
.green-grid.g2{grid-template-columns:1fr 1fr}
.green-grid.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.green-grid.g6{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
.green-grid.g9{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.guest{background:var(--card);border:1px solid var(--border);border-radius:8px;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:120px}
.guest.live{border-color:var(--cyan)}
.guest-canvas{flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1a1a1a,#000);position:relative}
.guest-canvas .gv-init{font-family:var(--sg);font-weight:600;font-size:32px;color:#fff;letter-spacing:-.02em;width:60px;height:60px;border-radius:50%;background:var(--g135);display:flex;align-items:center;justify-content:center}
.guest-foot{padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:11px;background:rgba(0,0,0,.5)}
.guest-foot .gn{flex:1;font-weight:600;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guest-foot .gr{font-family:var(--jb);font-size:9px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
.lt-strip{position:absolute;left:8px;right:8px;bottom:36px;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.4));border-left:3px solid var(--cyan);padding:4px 8px;border-radius:3px;font-size:11px;color:#fff}
.lt-strip .ltn{font-weight:600}
.lt-strip .ltr{font-family:var(--jb);font-size:9px;color:#bbb;letter-spacing:.06em;text-transform:uppercase}
.banner-bar{height:30px;background:var(--g);overflow:hidden;border-radius:6px;position:relative;display:flex;align-items:center}
.banner-bar .ticker{position:absolute;left:0;white-space:nowrap;animation:scroll 30s linear infinite;color:#000;font-weight:600;font-size:12px;letter-spacing:.04em;padding:0 12px}
@keyframes scroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.green-side{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}

/* ─── SPACE: STAGE ─── */
.stage-wrap{display:grid;grid-template-columns:1fr 280px;gap:14px;height:100%}
.stage-room{display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;min-height:0;overflow:auto;position:relative}
.stage-room::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% -20%,rgba(204,0,170,.1),transparent 60%);pointer-events:none}
.stage-topic{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.stage-topic .t{font-size:18px;font-weight:600;color:var(--white)}
.stage-topic .m{font-family:var(--jb);font-size:10px;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;margin-left:auto}
.stage-section h5{font-family:var(--jb);font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.speakers{display:flex;flex-wrap:wrap;gap:14px}
.speaker{display:flex;flex-direction:column;align-items:center;gap:6px;width:80px;text-align:center;position:relative}
.speaker .av{position:relative}
.speaker.live .av::before{content:'';position:absolute;inset:-3px;border-radius:50%;background:var(--g135);z-index:0}
.speaker .av .avatar{position:relative;z-index:1;width:54px;height:54px;font-size:17px}
.speaker .nm{font-size:11px;font-weight:600;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.speaker .rl{font-family:var(--jb);font-size:9px;color:var(--sub);letter-spacing:.04em;text-transform:uppercase}
.speaker .mic{position:absolute;bottom:24px;right:6px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;border:2px solid var(--bg);z-index:2}
.speaker.muted .mic{background:var(--orchid)}
.speaker.live .mic{background:var(--cyan);color:#000}
.audience{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:10px}
.audience .speaker .av .avatar{width:36px;height:36px;font-size:12px}
.audience .speaker .nm{font-size:9px}
.audience .speaker{width:auto}
.reactions{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border);position:relative;z-index:1}
.reaction{padding:6px 12px;border-radius:20px;background:var(--elevated);border:1px solid var(--border);font-size:14px;cursor:pointer}
.reaction:hover{border-color:#333}
.raised-list{display:flex;flex-direction:column;gap:6px}
.raised-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;background:var(--elevated);border:1px solid var(--border)}
.raised-item .nm{flex:1;font-size:12px;font-weight:600;color:var(--white)}

/* ─── SPACE: VERTICAL ─── */
.vert-wrap{display:flex;justify-content:center;align-items:center;height:100%;padding:8px;gap:18px}
.vert-stack{position:relative;width:min(380px,100%);height:100%;display:flex;flex-direction:column}
.vert-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.vert-art{flex:1;background:var(--g135);position:relative;display:flex;align-items:flex-end;padding:14px}
.vert-art::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.18),rgba(0,0,0,.8))}
.vert-art .vt{position:relative;z-index:1;color:#fff;font-size:14px;font-weight:600;line-height:1.4}
.vert-meta-top{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:8px;z-index:1}
.vert-meta-top .av{padding:2px;background:var(--g135);border-radius:50%}
.vert-meta-top .av .avatar{border:2px solid var(--bg)}
.vert-meta-top .nm{font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.vert-meta-top .ph{font-family:var(--jb);font-size:10px;color:rgba(255,255,255,.7);letter-spacing:.04em}
.vert-meta-top .live-dot{margin-left:auto;display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:3px;background:var(--flare);color:#fff;font-family:var(--jb);font-size:9px;letter-spacing:.06em}
.vert-meta-top .live-dot .d{width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
.vert-comments{position:absolute;left:14px;right:88px;bottom:60px;z-index:1;display:flex;flex-direction:column;gap:6px;max-height:140px;overflow:hidden;mask:linear-gradient(180deg,transparent 0,#fff 30%)}
.v-cm{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.v-cm .vn{font-weight:600}
.vert-actions{position:absolute;right:10px;bottom:80px;display:flex;flex-direction:column;gap:14px;z-index:1}
.vert-actions button{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);width:44px;height:44px;border-radius:50%;font-size:16px;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-direction:column;font-family:var(--sg);font-weight:600;backdrop-filter:blur(8px)}
.vert-actions .lbl{font-family:var(--jb);font-size:9px;color:#fff;letter-spacing:.04em;text-align:center;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.vert-actions .acti{display:flex;flex-direction:column;align-items:center;gap:3px}
.vert-compose{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:6px;align-items:center;z-index:1}
.vert-compose input{flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:8px 14px;color:#fff;font-size:12px;backdrop-filter:blur(8px)}
.vert-compose input::placeholder{color:rgba(255,255,255,.6)}
.vert-gifts{display:flex;flex-direction:column;gap:8px;width:140px;align-self:stretch;justify-content:center}
.vert-gifts .gh{font-family:var(--jb);font-size:9px;color:var(--sub);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.gift{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:border-color .15s}
.gift:hover{border-color:#333}
.gift .gd{width:8px;height:8px;border-radius:50%}
.gift .gn{flex:1;font-size:11px;font-weight:600;color:var(--white)}
.gift .gp{font-family:var(--jb);font-size:10px;color:var(--sub);letter-spacing:.04em}

/* ─── SPACE: LIBRARY ─── */
.lib-wrap{display:flex;flex-direction:column;gap:18px}
.profiles{display:flex;align-items:center;gap:14px;padding:8px 0}
.profile{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.profile .av{padding:2px;background:var(--elevated);border:1px solid var(--border);border-radius:50%}
.profile.active .av{background:var(--g135);border:none}
.profile .av .avatar{width:54px;height:54px;font-size:18px}
.profile .nm{font-size:11px;font-weight:600;color:var(--text)}

/* ─── SPACE: CLIPS ─── */
.clip-wrap{display:grid;grid-template-columns:1fr 300px;gap:14px;height:100%}
.clip-main{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.clip-creator{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.scrub{position:relative;height:42px;background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.scrub::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 9px,rgba(255,255,255,.04) 10px)}
.scrub-window{position:absolute;top:0;bottom:0;background:rgba(0,212,255,.12);border-left:2px solid var(--cyan);border-right:2px solid var(--cyan);left:35%;width:18%}
.scrub-now{position:absolute;top:0;bottom:0;width:2px;background:var(--white);left:42%}
.clip-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clip-side{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}

/* ─── SPACE: CHANNEL ─── */
.ch-wrap{display:grid;grid-template-columns:1fr 320px;gap:14px;height:100%}
.ch-main{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--g);opacity:.6}
.metric .mh{font-family:var(--jb);font-size:9px;color:var(--sub);letter-spacing:.08em;text-transform:uppercase}
.metric .mv{font-size:24px;font-weight:600;color:var(--white);margin-top:6px;letter-spacing:-.01em}
.metric .md{font-family:var(--jb);font-size:10px;color:var(--cyan);margin-top:4px;letter-spacing:.04em}
.metric .md.dn{color:var(--orchid)}
.spark{height:80px;border:1px solid var(--border);border-radius:8px;background:var(--card);padding:10px;position:relative}
.spark svg{display:block;width:100%;height:100%}
.chat-feed{flex:1;border:1px solid var(--border);border-radius:10px;background:var(--card);overflow:hidden;display:flex;flex-direction:column;min-height:240px}
.chat-feed-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.chat-feed-b{flex:1;overflow:auto;padding:10px 14px}
.cm{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:12px}
.cm .av{flex-shrink:0}
.cm .body{flex:1;min-width:0}
.cm .nm{font-weight:600;color:var(--white);font-size:11px}
.cm .nm.mod{color:var(--cyan)}
.cm .nm.host{color:var(--magenta)}
.cm .tx{color:var(--text);word-break:break-word}
.cm.super{background:linear-gradient(90deg,rgba(204,0,170,.1),transparent);padding:6px 8px;border-left:2px solid var(--magenta);border-radius:4px;margin:3px 0}
.cm.super .nm{color:var(--magenta)}
.cm.super .amt{font-family:var(--jb);font-size:10px;color:var(--magenta);margin-left:6px;letter-spacing:.04em}

/* ─── ⌘K PALETTE ─── */
.cmdk-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:100}
.cmdk-overlay.open{display:flex}
.cmdk{width:min(560px,calc(100vw - 24px));background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.cmdk-input{width:100%;padding:14px 16px;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--white);font-size:14px}
.cmdk-list{max-height:50vh;overflow:auto;padding:6px}
.cmdk-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text)}
.cmdk-item:hover,.cmdk-item.sel{background:var(--hover)}
.cmdk-item .group{font-family:var(--jb);font-size:9px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:auto}
.cmdk-foot{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:14px;font-family:var(--jb);font-size:9px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* ─── HELPERS ─── */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--sub)}
.mono{font-family:var(--jb)}
.gradtext{background:var(--g135);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
.divider{height:1px;background:var(--border);margin:10px 0}
.hide{display:none!important}
.kbd{font-family:var(--jb);font-size:9px;color:var(--muted);background:var(--elevated);border:1px solid var(--border);padding:1px 5px;border-radius:3px;letter-spacing:.04em}

@media(max-width:1100px){
  .watch-wrap,.green-wrap,.stage-wrap,.clip-wrap,.ch-wrap{grid-template-columns:1fr}
  .studio-wrap{grid-template-columns:200px 1fr}
  .sources-col{display:none}
  .metrics{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="grad-bar"></div>
<header class="topbar">
  <div class="brand"><span class="brand-bar"></span><span class="brand-name">RoadStream</span><span class="brand-meta">#21 · Streaming</span></div>
  <div class="spacer-flex"></div>
  <button class="cmdk-trigger" id="cmdkBtn"><span>⌕</span><span>Search Spaces, channels, layouts…</span><span class="kbd">⌘K</span></button>
  <span class="plan-pill"><span class="badge-dot"></span>Road Pass</span>
  <button class="btn-icon" id="railToggle" title="Receipts rail">⌗</button>
  <span class="avatar-ring"><span class="avatar">A</span></span>
</header>

<div class="shell with-rail" id="shell">
  <nav class="sidebar" id="sidebar">
    <button class="side-btn active" data-space="watch" title="Watch · Alt+1"><span class="ico">▶</span><span>Watch</span></button>
    <button class="side-btn" data-space="discover" title="Discover · Alt+2"><span class="ico">◇</span><span>Discover</span></button>
    <button class="side-btn" data-space="guide" title="Guide · Alt+3"><span class="ico">▦</span><span>Guide</span></button>

/* ───────────────────────── AUDIO RULE (mirrors server) ───────────────────────── */
function audibleSet(panes){
  const solos = panes.filter(p=>p.audio_state==='solo');
  const audible = solos.length ? new Set(solos.map(p=>p.id)) : new Set(panes.filter(p=>p.audio_state==='normal').map(p=>p.id));
  return audible;
}
function annotateAudible(panes){
  const set = audibleSet(panes);
  return panes.map(p=>({...p, audible:set.has(p.id)}));
}

}

}

function renderGuide(body){
  const cols = 12, slot = 30;
  const start = 6;
  const times = Array.from({length:cols},(_,i)=>{
    const m = start*60 + i*slot;
    const h = Math.floor(m/60)%24, mm = m%60;
    return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  });
  const nowMin = (new Date().getHours()*60+new Date().getMinutes()) - start*60;
  const nowX = Math.max(0, Math.min(cols*140, (nowMin/(slot))*140));
  body.innerHTML = `
  <div class="guide">
    <div class="gu-channels">
      <div class="gu-h">Channel</div>
      ${DEMO_GUIDE_CHANNELS.map(c=>`
        <div class="gu-ch">
          <span class="gu-ch-no">${c.no}</span>
          <div>
            <div class="gu-ch-name">${escapeHTML(c.name)}</div>
            <div class="gu-ch-blurb">${escapeHTML(c.blurb)}</div>
          </div>
        </div>`).join('')}
    </div>
    <div class="gu-grid">
      <div class="gu-times">${times.map(t=>`<div class="gu-time">${t}</div>`).join('')}</div>
      <div class="gu-rows">
        ${DEMO_GUIDE_CHANNELS.map((c,ri)=>`
          <div class="gu-row">
            ${guideRowBlocks(ri, cols).map((b,bi)=>`
              <div class="gu-block ${b.live?'live':''}" style="width:${b.span*140}px" data-broadcast="${escapeHTML(b.title)}">
                <div class="gb-title">${escapeHTML(b.title)}</div>
                <div class="gb-meta">${b.live?'live · ':''}${b.span*slot}min · ${c.name}</div>
              </div>`).join('')}
          </div>`).join('')}
        <div class="gu-now" style="left:${160+nowX}px"></div>
      </div>
    </div>
  </div>`;
}
function guideRowBlocks(rowIdx, cols){
  const seedRow = GUIDE_BLOCKS[rowIdx % GUIDE_BLOCKS.length];
  const blocks=[];
  let used=0,i=0;
  while(used<cols){
    const span = (i===0?2:i===1?3:i===2?2:i===3?2:1);
    const s = Math.min(span, cols-used);
    blocks.push({title:seedRow[(i)%seedRow.length], span:s, live:i===1 && rowIdx<3});
    used+=s; i++;
  }
  return blocks;
}
function bindGuide(){
  document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('[data-day]').forEach(x=>x.classList.toggle('on',x===b));
    state.guideDay=b.dataset.day; render();
  }));
  document.querySelectorAll('[data-broadcast]').forEach(b=>b.addEventListener('click',()=>{
    if(state.panes[0]){state.panes[0].title=b.dataset.broadcast;state.panes[0].subtitle='from Guide';state.panes[0].source_kind='wire';state.panes[0].live=true;state.panes[0].audio_state='normal';}
    pushReceipt({kind:'pane.replace',title:'pane 1 → '+b.dataset.broadcast,sub:'from guide'});
    setSpace('watch');
  }));
}

/* ───────────────────────── ⌘K PALETTE ───────────────────────── */
function cmdkItems(){
  const items = [];
  SPACES.forEach((s,i)=>items.push({label:'Go to '+SPACE_TITLE[s], group:'Space · Alt+'+((i+1)%10), do:()=>setSpace(s)}));
  LAYOUT_SHAPES.forEach(sh=>items.push({label:'Watch · layout '+sh, group:'Layout', do:()=>{state.layout.shape=sh;ensurePaneCount();setSpace('watch');}}));
  state.channels.slice(0,8).forEach(c=>items.push({label:'Tune · '+c.name, group:'Channel', do:()=>{pushReceipt({kind:'tune.in',title:c.slug,sub:'cmdk'});flash('Tuned '+c.slug);}}));
  items.push({label:'Toggle Receipts rail', group:'Action', do:()=>toggleRail()});
  items.push({label:state.studio.recording?'Stop recording':'Start recording', group:'Action', do:()=>{state.studio.recording=!state.studio.recording;pushReceipt({kind:'studio.rec',title:state.studio.recording?'started':'stopped',sub:'cmdk'});render();}});
  items.push({label:'Publish current layout as channel', group:'Action', do:()=>{const slug=state.layout.name.toLowerCase().replace(/[^a-z0-9]+/g,'-');pushReceipt({kind:'channel.publish',title:slug,sub:'cmdk'});flash('Published '+slug);}});
  return items;
}
function openCmdk(){state.cmdk.open=true;state.cmdk.query='';state.cmdk.sel=0;state.cmdk.items=cmdkItems();document.getElementById('cmdkOverlay').classList.add('open');renderCmdk();setTimeout(()=>document.getElementById('cmdkInput').focus(),0);}
function closeCmdk(){state.cmdk.open=false;document.getElementById('cmdkOverlay').classList.remove('open');document.getElementById('cmdkInput').value='';}
function renderCmdk(){
  const q=state.cmdk.query.toLowerCase();
  const filtered = state.cmdk.items.filter(i=>!q||(i.label+' '+i.group).toLowerCase().includes(q));
  document.getElementById('cmdkList').innerHTML = filtered.length?filtered.map((it,i)=>`<div class="cmdk-item ${i===state.cmdk.sel?'sel':''}" data-cmdk-i="${i}"><span>${escapeHTML(it.label)}</span><span class="group">${escapeHTML(it.group)}</span></div>`).join(''):'<div class="cmdk-item muted" style="cursor:default">No matches.</div>';
  state.cmdk._filtered = filtered;
  document.querySelectorAll('[data-cmdk-i]').forEach(el=>el.addEventListener('click',()=>{const i=Number(el.dataset.cmdkI);const it=filtered[i];if(it){closeCmdk();it.do();}}));
}

/* ───────────────────────── KEYBOARD ───────────────────────── */
window.addEventListener('keydown',e=>{
  // ⌘K / Ctrl+K
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.cmdk.open?closeCmdk():openCmdk();return;}
  if(state.cmdk.open){
    if(e.key==='Escape'){e.preventDefault();closeCmdk();return;}
    if(e.key==='ArrowDown'){e.preventDefault();state.cmdk.sel=Math.min((state.cmdk._filtered||[]).length-1,state.cmdk.sel+1);renderCmdk();return;}
    if(e.key==='ArrowUp'){e.preventDefault();state.cmdk.sel=Math.max(0,state.cmdk.sel-1);renderCmdk();return;}
    if(e.key==='Enter'){e.preventDefault();const it=(state.cmdk._filtered||[])[state.cmdk.sel];if(it){closeCmdk();it.do();}return;}
    return;
  }
  // Alt+1..0
  if(e.altKey && /^[0-9]$/.test(e.key)){e.preventDefault();const i = e.key==='0'?9:parseInt(e.key,10)-1;setSpace(SPACES[i]);return;}
  // Watch shortcuts
  if(state.space==='watch'){
    if(e.key==='m'||e.key==='M'){const p=state.panes[state.layout.hero_pane||0];if(p){p.audio_state='muted';render();}}
    if(e.key==='s'||e.key==='S'){const p=state.panes[state.layout.hero_pane||0];if(p){p.audio_state=p.audio_state==='solo'?'normal':'solo';render();}}
    if(e.key==='[')state.layout.hero_pane=(state.layout.hero_pane-1+state.panes.length)%state.panes.length,render();
    if(e.key===']')state.layout.hero_pane=((state.layout.hero_pane||0)+1)%state.panes.length,render();
  }
  if(state.space==='vertical'){
    if(e.key==='ArrowDown'||e.key==='j'){state.vertical.idx=(state.vertical.idx+1)%DEMO_VERTICAL.length;render();}
    if(e.key==='ArrowUp'||e.key==='k'){state.vertical.idx=(state.vertical.idx-1+DEMO_VERTICAL.length)%DEMO_VERTICAL.length;render();}
  }
});

/* ───────────────────────── BINDINGS / WIRING ───────────────────────── */
function bindSpace(){

  // Per-space
  ({watch:bindWatch,discover:bindDiscover,guide:bindGuide,studio:bindStudio,greenroom:bindGreen,stage:bindStage,vertical:bindVertical,library:bindLibrary,clips:bindClips,channel:bindChannel}[state.space])();
}

function toggleRail(){state.rail=!state.rail;document.getElementById('shell').classList.toggle('with-rail',state.rail);}
function flash(msg){document.getElementById('statusEngine').textContent='BlackStream · '+msg;clearTimeout(window._fl);window._fl=setTimeout(()=>{document.getElementById('statusEngine').textContent='BlackStream · ready';},2400);}

/* ───────────────────────── BOOT ───────────────────────── */
document.querySelectorAll('.side-btn[data-space]').forEach(b=>b.addEventListener('click',()=>setSpace(b.dataset.space)));

document.getElementById('sidebarToggle').addEventListener('click',()=>{state.sidebar=!state.sidebar;document.getElementById('shell').classList.toggle('collapsed',!state.sidebar);});
document.getElementById('cmdkBtn').addEventListener('click',openCmdk);
document.getElementById('cmdkInput').addEventListener('input',e=>{state.cmdk.query=e.target.value;state.cmdk.sel=0;renderCmdk();});

// Initial render
render();
// Tick: live viewer counts drift
setInterval(()=>{
  state.channels.forEach(c=>{c.live_viewers = Math.max(0, c.live_viewers + Math.round((Math.random()-0.45)*6));});
  state.channel.viewersCurr = Math.max(0, state.channel.viewersCurr + Math.round((Math.random()-0.45)*8));
  if(state.space==='discover'||state.space==='channel') render();
},5200);
