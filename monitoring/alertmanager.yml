# Local inspection only: no email, Slack, webhook or other notification destination.
# Configure a real receiver explicitly before relying on outbound alert delivery.
global:
  resolve_timeout: 5m

route:
  receiver: local-only
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-only
