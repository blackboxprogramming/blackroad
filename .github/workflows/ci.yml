name: CI - Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: 22
  PYTHON_VERSION: 3.11

jobs:
  # Python API Services
  python-lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy pytest pylint
      
      - name: Format check with black
        run: black --check *.py
        continue-on-error: true
      
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Type check with mypy
        run: mypy *.py --ignore-missing-imports
        continue-on-error: true

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blackroad_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blackroad_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      
      - name: Apply committed database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest --cov=. --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: python
          name: codecov-python

  # Dashboard (React)
  dashboard-lint:
    name: Dashboard Lint & Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./dashboard
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
      
      - name: Build
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/dist
          retention-days: 5

  # Mobile App (React Native)
  mobile-lint:
    name: Mobile App Lint & Bundle
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./mobile
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check for errors
        run: npm run lint

      - name: Check Expo dependency compatibility
        env:
          CI: '1'
        run: npm run check:dependencies

      - name: Export Android and iOS JavaScript bundles
        env:
          CI: '1'
        run: npm run export:check

      - name: Upload mobile JavaScript bundles
        uses: actions/upload-artifact@v4
        with:
          name: mobile-js-bundles
          path: mobile/dist
          if-no-files-found: error
          retention-days: 5

  # Security & Quality
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Preserve Trivy report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Code Quality
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONARCLOUD_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        continue-on-error: true

  dashboard-container:
    name: Dashboard Container HTTP Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the dashboard through its Compose service
        run: docker compose -f docker-compose.prod.yml build react-web
      - name: Start only the dashboard container
        run: docker compose -f docker-compose.prod.yml up -d --no-deps --wait --wait-timeout 60 react-web
      - name: Verify served pages, assets and API boundary
        run: python3 scripts/check-dashboard-http.py http://127.0.0.1:3002
      - name: Dashboard logs
        if: failure()
        run: |
          docker compose -f docker-compose.prod.yml logs react-web
          docker inspect --format '{{json .State.Health}}' blackroad-react-web
      - name: Stop dashboard container
        if: always()
        run: docker compose -f docker-compose.prod.yml down

  deployment-source:
    name: Deployment Source Readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Compose source prerequisites without starting services
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.prod.yml config --format json |
            python3 scripts/deployment_preflight.py --root "$GITHUB_WORKSPACE"

  # Notify
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    if: always()
    needs: [python-lint, python-test, dashboard-lint, mobile-lint, security-scan, deployment-source, dashboard-container]
    
    steps:
      - uses: actions/checkout@v4
      - name: Check all required job results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-results.py
